canvas{width:min(100vw,1200px);image-rendering:pixelated;background:#000}
#bar{width:min(100vw,1200px);display:flex;flex-wrap:wrap;gap:2px;padding:.5rem;box-sizing:border-box}

#touch{display:none}
body.touch{touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body.touch canvas{width:min(100vw,calc((100vh - 8px) * 880 / 492));touch-action:none}
body.touch #touch{display:block;position:fixed;inset:0;pointer-events:none;z-index:5}
@media (orientation:portrait){body.touch canvas{width:100vw}}
.stick{position:absolute;bottom:18px;width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);pointer-events:auto;touch-action:none}

#stickL{left:18px}#stickR{right:18px}
.tbtn{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font:13px Galmuri11,monospace;

.tbtn.on{background:rgba(255,255,255,.4)}

  if (DEX.size >= 100) ach('dex100');
  if (DEX.size >= 200) ach('dex200');
  if (p.level >= 50) ach('lv50');
  if (p.money >= 50000) ach('rich');
  if (p.items.length >= 15) ach('items15');
  if ((p.trainerWins ?? 0) >= 15) ach('trainer15');
  if (loadUnlocked().length >= 5) ach('legend5');
  if (CLEARED.size >= 3) ach('champ3');
  if (CLEARED.size >= REGIONS.length) ach('champ9');
}
// 챔피언을 이긴 순간: 지방 클리어 기록과 챔피언 도전과제
function recordClear() {
  const p = player, i = REGIONS.indexOf(region), next = REGIONS[i + 1], wasOpen = next && regionOpen(i + 1);
  CLEARED.add(region.name); store.set(CLEAR_KEY, [...CLEARED]);
  p.unlockedNext = next && !wasOpen ? next.name : null;
  ach('champion');
  if (p.time < 40 * 60) ach('fast');
  if (p.mon.id === 25 || p.mon.id === 26) ach('pika');
  checkAch();
}

// 스프라이트의 불투명 픽셀 범위. 발끝(y1)을 땅 좌표에 맞춰 그려서 떠 보이지 않게 한다
function spriteBox(img) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = Infinity, x1 = 0, y0 = Infinity, y1 = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 0) {
    const k = (i - 3) / 4, x = k % c.width, y = Math.floor(k / c.width);
    x0 = Math.min(x0, x); x1 = Math.max(x1, x + 1); y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1);
  }
  return x1 > x0 ? { x0, x1, y0, y1 } : { x0: 24, x1: 72, y0: 24, y1: 80 };
}

// 필드용 걷기/대기 애니메이션: PMD SpriteCollab (CC BY-NC 4.0). 줄 순서는 아래, 오른아래, 오른, 오른위, 위, 왼위, 왼, 왼아래
const PMD = 'https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite';
async function loadField(id, form = '') {
  const base = `${PMD}/${String(id).padStart(4, '0')}${form}`;
  try {
    const xml = await cfetch(`${base}/AnimData.xml`).then(r => r.ok ? r.text() : Promise.reject(new Error('no anim')));
    const blocks = xml.split('<Anim>').slice(1);
    const anim = name => {
      const b = blocks.find(b => b.includes(`<Name>${name}</Name>`));
      if (!b) return null;
      const copy = b.match(/<CopyOf>(\w+)<\/CopyOf>/);
      if (copy) return anim(copy[1]);
      return { name, fw: +b.match(/<FrameWidth>(\d+)/)[1], fh: +b.match(/<FrameHeight>(\d+)/)[1], dur: [...b.matchAll(/<Duration>(\d+)/g)].map(m => +m[1]) };
    };
    const walk = anim('Walk'), idle = anim('Idle');
    if (!walk) return null;
    walk.img = await loadImg(`${base}/${walk.name}-Anim.png`);
    if (idle) idle.img = await loadImg(`${base}/${idle.name}-Anim.png`).catch(() => null);
    for (const a of [walk, idle]) if (a?.img) { a.rows = Math.max(1, Math.floor(a.img.height / a.fh)); a.total = a.dur.reduce((s, d) => s + d, 0); a.foot = frameFoot(a); }
    return { walk, idle: idle?.img ? idle : walk };
  } catch { return null; }
}

// 아래 방향 첫 프레임의 불투명 범위로 발끝과 몸 크기를 잰다
function frameFoot(a) {
  const c = document.createElement('canvas'); c.width = a.fw; c.height = a.fh;
  const g = c.getContext('2d'); g.drawImage(a.img, 0, 0, a.fw, a.fh, 0, 0, a.fw, a.fh);
  const d = g.getImageData(0, 0, a.fw, a.fh).data;
  let x0 = Infinity, x1 = 0, y0 = Infinity, y1 = 0;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 0) { const k = (i - 3) / 4, x = k % a.fw, y = Math.floor(k / a.fw); x0 = Math.min(x0, x); x1 = Math.max(x1, x + 1); y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1); }
  return x1 > x0 ? { cx: (x0 + x1) / 2, by: y1, w: x1 - x0, h: y1 - y0 } : { cx: a.fw / 2, by: a.fh * 0.8, w: a.fw * 0.6, h: a.fh * 0.6 };
}

const refreshFx = () => { FX = new Set([...player.moves].map(id => moveDef(id)?.fx).filter(Boolean)); legendPow = 1.5 ** [...player.moves].filter(id => moveDef(id)?.legend).length; };
const starterIds = () => [...new Set([...region.starters, 25, ...achRewards(), ...[...STARTERS].sort((a, b) => a - b), ...loadUnlocked()])].filter(id => MON[id]);

const baseOf = m => ({ hp: Math.round(m.st.hp / 7.5), dmg: Math.max(m.st.attack, m.st['special-attack']) / 20, speed: 120 + m.st.speed * 1.5 });
// 레벨업 필요 경험치: 초반엔 적게, 갈수록 기하급수로 (5레벨 15, 30레벨 177, 60레벨 3400쯤)
const expNeed = lv => Math.round(20 * 2 ** ((lv - 8) / 7));

// 전설은 x20에 나타난 곳의 단계마다 x1.6: 기본 체력이 관장의 2배라 같은 단계 관장 에이스의 약 4배, 관장 팀 전체보다 조금 더 단단하다
// 플레이어 화력이 단계마다 1.5배쯤 크는 것(dps 시뮬레이션)에 맞춘 값
// 관장·라이벌·사천왕 체력 보정: 단계(tier = 들어갈 때 가진 배지 수)별로 곱한다. 초반을 가볍게, 배지 5개부터는 원래대로
// 배지 0개(첫 체육관) ~ 4개까지 차례로. 숫자를 바꾸면 바로 반영된다
const BOSS_HP_EARLY = [0.45, 0.55, 0.65, 0.75, 0.88];
const bossEase = t => t >= BOSS_HP_EARLY.length ? 1 : BOSS_HP_EARLY[Math.max(0, Math.floor(t))];
// 트레이너(체육관 트레이너·필드 트레이너) 체력: 야생의 TRAINER_HP배에, 단계별 보정을 곱한다. 5단계부터는 보정 없음

const trainerEase = t => t >= TRAINER_HP_EARLY.length ? 1 : TRAINER_HP_EARLY[Math.max(0, Math.floor(t))];
// 체육관 구성: 트레이너 방 수와 트레이너 한 명의 포켓몬 수 [최소, 최대]. 앞쪽 EARLY_GYMS개 체육관은 적게
const EARLY_GYMS = 3, GYM_ROOMS = { early: [1, 2], late: [2, 3] }, GYM_TRAINER_MONS = { early: [1, 2], late: [2, 3] };
const rollRange = ([a, b]) => a + Math.floor(Math.random() * (b - a + 1));
const hpMult = (rank, t) => rank === 'legend' ? 20 * 1.6 ** t : rank === 'boss' ? 10 * 1.6 ** t * bossEase(t) : rank === 'trainer' ? 2 * 1.5 ** t * trainerEase(t) : 2 * 1.5 ** t;

function learnMove(id) {

// ---------- 지도 ----------
function parseMap(rg) {
  const cells = [], links = [];
  rg.map.forEach((line, y) => {
    for (let x = 0; x < line.length; x++) {
      const ch = line[x];
      if (y % 2 === 0 && x % 2 === 0 && ch !== ' ') cells.push({ ch, x: x / 2, y: y / 2 });
      if (y % 2 === 0 && x % 2 === 1 && ch === '-') links.push([line[x - 1], line[x + 1]]);
      if (y % 2 === 1 && x % 2 === 0 && ch === '|') links.push([rg.map[y - 1]?.[x], rg.map[y + 1]?.[x]]);
    }
  });
  return { cells, links };
}

function makeNoise(rnd) {
  const S = 64, g = Array.from({ length: S * S }, rnd), at = (x, y) => g[((y % S + S) % S) * S + ((x % S + S) % S)];
  return (x, y) => {
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}

// 바닥에 놓인 볼의 종류로 내용물의 희귀도를 알린다: 흔한 도구·나무열매 < 희귀한 도구 < 기술머신·아주 희귀한 도구·중요한 물건 < 특별한 기술머신
const BALLS = ['poke-ball', 'great-ball', 'ultra-ball', 'master-ball'];
const ballGrade = k => k.kind === 'tm' ? (k.tm.legend ? 3 : 2) : k.kind === 'item' ? { c: 0, r: 1, l: 2, k: 2 }[k.item.r] ?? 0 : 0;
// 상자 내용물. tm = 일반 기술머신 확률, ltm = 전설의 기술머신 확률, 나머지는 아이템 등급 비율
function rollContent(rnd, { tm = 0, ltm = 0, c = 0.6, r = 0.35, l = 0.05 }) {
  const fromPool = list => { const pool = list.filter(t => !taken.has(t.id) && !player?.moves.has(t.id)); if (!pool.length) return null; const t = pool[Math.floor(rnd() * pool.length)]; taken.add(t.id); return { kind: 'tm', tm: t }; };
  const roll = rnd();
  if (roll < ltm) { const t = fromPool(LTMS); if (t) return t; }
  if (roll < ltm + tm) { const t = fromPool(TMS); if (t) return t; }
  const r2 = rnd() * (c + r + l), tier = r2 < c ? 'c' : r2 < c + r ? 'r' : 'l';
  let pool = ITEMS.filter(i => i.r === tier && !taken.has(i.id));
  if (!pool.length) pool = ITEMS.filter(i => i.r !== 'k' && !taken.has(i.id));
  if (!pool.length) return { kind: 'berry' };
  const it = pool[Math.floor(rnd() * pool.length)];
  taken.add(it.id);
  return { kind: 'item', item: it };
}

// 골드 지도처럼: 장소마다 자유롭게 돌아다닐 수 있는 구역이 있고, 구역 사이는 곧게 뻗은 길로만 이어진다. 나머지는 숲·바위·바다로 막혀 있다
function genWorld(seed) {
  const rnd = mulberry32(seed), noise = makeNoise(rnd), { cells, links } = parseMap(region);
  const cols = Math.max(...cells.map(c => c.x)) + 1, rows = Math.max(...cells.map(c => c.y)) + 1;
  const tw = (cols - 1) * CELL + MARGIN * 2 + 1, th = (rows - 1) * CELL + MARGIN * 2 + 1, N = tw * th;
  const nodes = cells.map((c, i) => {
    const [name, kind, extra] = region.places[c.ch];
    return { i, ch: c.ch, gx: c.x, gy: c.y, name, kind, tx: MARGIN + c.x * CELL, ty: MARGIN + c.y * CELL, start: extra === 'start', league: extra === 'league',
      gym: typeof extra === 'number' ? region.gyms[extra] : null, legends: Array.isArray(extra) ? extra : [], links: [] };
  });
  const byCh = Object.fromEntries(nodes.map(n => [n.ch, n]));
  for (const [a, b] of links) { byCh[a].links.push(byCh[b]); byCh[b].links.push(byCh[a]); }
  const start = nodes.find(n => n.start), dist = new Map([[start, 0]]), q = [start];
  for (let i = 0; i < q.length; i++) for (const n of q[i].links) if (!dist.has(n)) { dist.set(n, dist.get(q[i]) + 1); q.push(n); }
  const maxD = Math.max(...dist.values()) || 1;
  for (const n of nodes) {
    n.tier = Math.round(dist.get(n) / maxD * 7);
    // 마을은 반듯한 광장, 일직선으로 지나가는 길은 진행 방향으로 길쭉한 구역
    const h = n.links.some(l => l.gy === n.gy), v = n.links.some(l => l.gx === n.gx);
    [n.hx, n.hy] = n.kind === 'T' || n.gym || n.league ? [10, 8] : h && !v ? [12, 6] : v && !h ? [6, 12] : [10, 10];
  }

  const area = new Int16Array(N), zone = new Uint8Array(N), solid = new Uint8Array(N).fill(1), road = new Uint8Array(N), deco = new Uint8Array(N);
  // 바깥(막힌 곳)의 모습은 가장 가까운 장소를 따른다
  for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
    let best = Infinity, bn = 0;
    for (const n of nodes) { const d = Math.abs(tx - n.tx) + Math.abs(ty - n.ty); if (d < best) { best = d; bn = n.i; } }
    area[ty * tw + tx] = bn;
  }
  for (const n of nodes) for (let ty = n.ty - n.hy - 2; ty <= n.ty + n.hy + 2; ty++) for (let tx = n.tx - n.hx - 2; tx <= n.tx + n.hx + 2; tx++) {
    if (tx < 3 || ty < 3 || tx >= tw - 3 || ty >= th - 3) continue;
    const wob = n.kind === 'T' || n.gym || n.league ? 0 : (noise(tx / 4, ty / 4) - 0.5) * 0.35;
    if (Math.max(Math.abs(tx - n.tx) / n.hx, Math.abs(ty - n.ty) / n.hy) + wob < 1) { const k = ty * tw + tx; zone[k] = 1; solid[k] = 0; area[k] = n.i; }
  }
  // 구역 사이를 잇는 폭 5칸 길, 가운데 3칸은 흙길
  for (const [a, b] of links) {
    const A = byCh[a], B = byCh[b], steps = Math.ceil(Math.hypot(B.tx - A.tx, B.ty - A.ty));
    for (let s = 0; s <= steps; s++) {
      const x = Math.round(A.tx + (B.tx - A.tx) * s / steps), y = Math.round(A.ty + (B.ty - A.ty) * s / steps);
      for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
        const k = (y + oy) * tw + x + ox;
        if (!zone[k]) zone[k] = 2;
        solid[k] = 0;
        if (Math.abs(ox) <= 1 && Math.abs(oy) <= 1) road[k] = 1;
      }
    }
  }
  // 구역 안 장애물. 흙길 바로 옆은 비워서 길이 잘 보이게 한다
  for (let ty = 1; ty < th - 1; ty++) for (let tx = 1; tx < tw - 1; tx++) {
    const k = ty * tw + tx, n = nodes[area[k]];
    if (zone[k] !== 1 || road[k]) continue;
    if (n.kind === 'T' || n.gym || n.league) { if (rnd() < 0.03) deco[k] = 2; continue; }
    if (road[k - 1] || road[k + 1] || road[k - tw] || road[k + tw] || Math.hypot(tx - n.tx, ty - n.ty) < 3) continue;
    const v = noise(tx / 5, ty / 5) * 0.75 + rnd() * 0.25;
    if (v > 1 - KINDS[n.kind].dens * 1.4) solid[k] = 1;
    else if (rnd() < 0.08) deco[k] = 1 + Math.floor(rnd() * 3);
  }
  // 원작 도로의 디테일: 풀숲(야생 포켓몬은 여기서 나온다), 턱(8: 아래로만 뛰어내림), 작은 연못(9)
  const grass = new Uint8Array(N);
  for (const n of nodes) {
    if (n.kind !== 'R' && n.kind !== 'F') continue;
    for (let ty = n.ty - n.hy; ty <= n.ty + n.hy; ty++) for (let tx = n.tx - n.hx; tx <= n.tx + n.hx; tx++) {
      const k = ty * tw + tx;
      if (zone[k] === 1 && area[k] === n.i && !solid[k] && !road[k] && noise(tx / 3.5 + 40, ty / 3.5 + 40) > 0.52) { grass[k] = 1; deco[k] = 0; }
    }
    // 턱은 길이 지나는 곳에 틈을 두고, 양 끝도 비워서 돌아 올라올 수 있게 한다
    if (n.kind === 'R') for (const ly of n.hy >= 10 ? [n.ty - 4, n.ty + 4] : [n.ty + 3]) for (let tx = n.tx - n.hx + 2; tx <= n.tx + n.hx - 2; tx++) {
      const k = ly * tw + tx;
      if (zone[k] !== 1 || solid[k] || area[k] !== n.i || [-2, -1, 0, 1, 2].some(o => road[k + o])) continue;
      solid[k] = 8; grass[k] = 0; deco[k] = 0;
    }
    if (rnd() < 0.5) {
      const px = n.tx + Math.round((rnd() * 2 - 1) * (n.hx - 4)), py = n.ty + Math.round((rnd() * 2 - 1) * (n.hy - 4)), pr = 1.5 + rnd();
      if (Math.hypot(px - n.tx, py - n.ty) > 4) for (let ty = py - 3; ty <= py + 3; ty++) for (let tx = px - 3; tx <= px + 3; tx++) {
        const k = ty * tw + tx;
        if (Math.hypot(tx - px, ty - py) < pr && zone[k] === 1 && !solid[k] && !road[k] && ![-1, 1, -tw, tw].some(o => road[k + o])) { solid[k] = 9; grass[k] = 0; deco[k] = 0; }
      }
    }
  }

  const w = { kind: 'world', seed, tw, th, nodes, area, zone, solid, road, deco, grass, buildings: [], npcs: [], pickups: [], enemies: [], signs: [], battle: null };
  // 건물: 체육관, 포켓몬리그만. 문으로 들어갈 수 있다
  const building = (n, kind, ox, oy, bw, bh, extra = {}) => {
    const x = n.tx + ox, y = n.ty + oy;
    for (let yy = y; yy < y + bh; yy++) for (let xx = x; xx < x + bw; xx++) { solid[yy * tw + xx] = 3; road[yy * tw + xx] = 0; deco[yy * tw + xx] = 0; }
    const dx = x + Math.floor(bw / 2);
    for (let yy = y + bh; yy < y + bh + 3; yy++) for (let xx = dx - 1; xx <= dx + 1; xx++) { solid[yy * tw + xx] = 0; road[yy * tw + xx] = 1; zone[yy * tw + xx] ||= 1; }
    const b = { id: w.buildings.length, kind, x, y, w: bw, h: bh, node: n, doorX: (dx + 0.5) * TS, doorY: (y + bh) * TS, ...extra };
    w.buildings.push(b);
    return b;
  };
  let npcId = 0;
  const towns = nodes.filter(n => n.kind === 'T').sort((a, b) => a.tier - b.tier || (b.start ? 1 : 0) - (a.start ? 1 : 0));
  for (const n of nodes) {
    if (n.gym) building(n, 'gym', -8, 1, 7, 4, { type: n.gym.type });
    if (n.league) building(n, 'league', 2, 1, 8, 4, { type: 'dragon' });
    if (n.kind !== 'T') continue;
    // 회복과 상점은 건물 없이 마을 한가운데 NPC에게 말을 건다 (연못은 중심 4칸 밖에만 생겨서 이 자리는 비어 있다)
    w.npcs.push({ id: npcId++, kind: 'nurse', sprite: 'nurse', name: '간호순', x: (n.tx - 2.5) * TS, y: (n.ty - 1.5) * TS });
    w.npcs.push({ id: npcId++, kind: 'shop', sprite: 'clerk', name: '점원', x: (n.tx + 3.5) * TS, y: (n.ty - 1.5) * TS, special: rollContent(rnd, { tm: 0.35, ltm: 0.05, c: 0, r: 0.7, l: 0.3 }) });
    // 첫 마을은 기술머신을, 다음 마을들은 중요한 물건(자전거 등)을, 나머지는 가끔 희귀한 도구를 준다
    const idx = towns.indexOf(n), key = idx > 0 ? KEY_ITEMS[idx - 1] : null;
    if (idx === 0 || key || rnd() < 0.5) {
      const [sprite, name] = FRIENDLY[Math.floor(rnd() * FRIENDLY.length)];
      const gift = idx === 0 ? rollContent(rnd, { tm: 1 }) : key ? (taken.add(key), { kind: 'item', item: itemById(key) }) : rollContent(rnd, { tm: 0.3, ltm: 0.03, c: 0.3, r: 0.6, l: 0.1 });
      w.npcs.push({ id: npcId++, kind: 'gift', sprite, name, x: (n.tx + 6.5) * TS, y: (n.ty - 3.5) * TS, gift });
    }
  }
  // 마을 가장자리 울타리(10). 길과 이어진 입구는 열어 둔다
  for (let k = tw; k < N - tw; k++) {
    if (zone[k] !== 1 || solid[k] || road[k]) continue;
    const n = nodes[area[k]];
    if ((n.kind === 'T' || n.gym || n.league) && [-1, 1, -tw, tw].some(o => zone[k + o] === 0)) solid[k] = 10;
  }
  // 동굴 입구: 동굴 구역으로 들어가는 길목
  w.mouths = [];
  for (const [a, b] of links) for (const [n, o] of [[byCh[a], byCh[b]], [byCh[b], byCh[a]]]) if (n.kind === 'C') {
    const dx = Math.sign(o.gx - n.gx), dy = Math.sign(o.gy - n.gy);
    w.mouths.push({ x: n.tx + dx * (n.hx + 1), y: n.ty + dy * (n.hy + 1), vertical: !!dy });
  }
  // 구역 출구마다 갈 곳을 알려주는 표지판
  for (const n of nodes) for (const l of n.links) {
    const dx = Math.sign(l.gx - n.gx), dy = Math.sign(l.gy - n.gy);
    const sx = n.tx + dx * (n.hx - 2) + (dy ? 3 : 0), sy = n.ty + dy * (n.hy - 2) + (dx ? -3 : 0);
    if (solid[sy * tw + sx]) continue;
    w.signs.push({ x: (sx + 0.5) * TS, y: (sy + 0.5) * TS, text: `${dx > 0 ? '→' : dx < 0 ? '←' : dy < 0 ? '↑' : '↓'} ${l.name}` });
  }
  // 시작점에서 걸어갈 수 있는 칸
  const reach = new Uint8Array(N);
  const flood = () => {
    reach.fill(0);
    const rq = [start.ty * tw + start.tx];
    reach[rq[0]] = 1;
    for (let i = 0; i < rq.length; i++) {
      const k = rq[i], x = k % tw, y = (k - x) / tw;
      for (const [dx, dy] of DIRS) { const nk = (y + dy) * tw + x + dx; if (!reach[nk] && !solid[nk]) { reach[nk] = 1; rq.push(nk); } }
    }
  };
  flood();
  // 턱 아래로 뛰어내렸는데 다시 못 올라오는 곳이 생기면 그 턱은 평지로 되돌린다
  let fixed = false;
  for (let k = tw; k < N - tw; k++) if (solid[k] === 8 && !solid[k + tw] && !reach[k + tw]) { solid[k] = 0; fixed = true; }
  if (fixed) flood();
  w.reach = reach;
  const spotNear = (n, avoidRoad) => {
    for (let t = 0; t < 300; t++) {
      const x = Math.round(n.tx + (rnd() * 2 - 1) * n.hx), y = Math.round(n.ty + (rnd() * 2 - 1) * n.hy), k = y * tw + x;
      if (reach[k] && !solid[k] && zone[k] === 1 && (!avoidRoad || !road[k]) && area[k] === n.i) return [(x + 0.5) * TS, (y + 0.5) * TS];
    }
    return [(n.tx + 0.5) * TS, (n.ty + 0.5) * TS];
  };
  let pk = 0;
  for (const n of nodes) {
    if (n.kind === 'T' || n.gym || n.league) continue;
    for (let i = 0, c = 2 + Math.floor(rnd() * 3); i < c; i++) {
      const [x, y] = spotNear(n, true);
      w.pickups.push({ id: `pk${pk++}`, x, y, ball: true, ...rollContent(rnd, n.kind === 'S' ? { tm: 0.2, ltm: 0.06, c: 0.45, r: 0.35, l: 0.2 } : { tm: 0.2, ltm: 0.03, c: 0.68, r: 0.3, l: 0.02 }) });
    }
    const pool = TRAINERS[n.kind] ?? TRAINERS.R;
    for (let i = 0, c = 1 + Math.floor(rnd() * 2); i < c; i++) {
      const [sprite, name] = pool[Math.floor(rnd() * pool.length)], [x, y] = spotNear(n, false);
      w.npcs.push({ id: npcId++, kind: 'trainer', sprite, name, x, y, hx: x, hy: y, r: 14, dir: [0, 0], turn: rnd() * 2, node: n });
    }
  }
  // 전설의 포켓몬: 한 판에 1~3마리가 지방 명소(떠돌이 전설은 아무 길)에 반드시 나온다
  const cands = nodes.flatMap(n => n.legends.map(id => ({ id, n })));
  const wild = nodes.filter(n => n.kind !== 'T' && !n.gym && !n.league);
  region.roam.forEach(id => cands.push({ id, n: wild[Math.floor(rnd() * wild.length)] }));
  for (let i = cands.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cands[i], cands[j]] = [cands[j], cands[i]]; }
  const picked = [];
  for (const c of cands) if (picked.length < 1 + Math.floor(rnd() * 3) && !picked.some(p => p.id === c.id)) picked.push(c);
  w.legends = picked.map((c, i) => { const [x, y] = c.n.legends.includes(c.id) ? [(c.n.tx + 0.5 + (i % 2) * 2) * TS, (c.n.ty + 0.5) * TS] : spotNear(c.n, true); return { i, id: c.id, n: c.n, x, y, done: false, alive: false }; });
  w.start = [(start.tx + 0.5) * TS, (start.ty + 3.5) * TS];
  return w;
}

// 건물 안: 아래에서 위로 방이 이어진다. 체육관은 트레이너 방 2~3개 + 관장 방, 리그는 사천왕 방 4개 + 훨씬 큰 챔피언 방
// 방에 들어서면 문이 닫히고, 이기면 위쪽 문(가운데 3칸)이 열린다. 맨 아래 방의 아래 문이 출구
function makeIndoor(b) {
  const league = b.kind === 'league', g = b.node.gym, last = region.league.length - 1;
  const specs = league ? region.league.map((who, i) => ({ w: i === last ? 31 : 21, h: i === last ? 19 : 13, who, type: who.type }))
    : [...Array(rollRange(GYM_ROOMS[player.beaten.size < EARLY_GYMS ? 'early' : 'late'])).fill({ w: 21, h: 13, type: b.type }), { w: 23, h: 15, who: g, type: b.type }];
  const tw = Math.max(...specs.map(s => s.w)), th = specs.reduce((a, s) => a + s.h - 1, 1), cx = Math.floor(tw / 2);
  const solid = new Uint8Array(tw * th).fill(4), voids = new Uint8Array(tw * th).fill(1), set = (x, y, v) => solid[y * tw + x] = v;
  const m = { kind: 'indoor', sub: b.kind, building: b, tw, th, solid, voids, rooms: [], npcs: [], pickups: [], enemies: [], buildings: [], signs: [], battle: null, type: b.type, furn: [], leader: g };
  const furn = (kind, x, y) => { m.furn.push({ kind, x, y, w: 1, h: 1 }); set(x, y, 7); };
  const door = y => [cx - 1, cx, cx + 1].map(x => y * tw + x);
  let y1 = th - 1;
  specs.forEach((s, i) => {
    const y0 = y1 - (s.h - 1), x0 = cx - (s.w - 1) / 2;
    for (let y = y0; y <= y1; y++) for (let x = x0; x < x0 + s.w; x++) { voids[y * tw + x] = 0; if (x > x0 && x < x0 + s.w - 1 && y > y0 && y < y1) set(x, y, 0); }
    // 기둥(지진 엄폐물): 좌우 대칭으로, 서로 붙지 않게 흩어 놓아서 길이 막히지 않는다. 가운데 통로와 위아래 두 줄은 비운다
    const pil = [], want = 2 * (s.who ? 3 : 3 + Math.floor(Math.random() * 3));
    for (let t = 0; t < 300 && pil.length < want; t++) {
      const x = x0 + 2 + Math.floor(Math.random() * (s.w - 4)), y = y0 + 3 + Math.floor(Math.random() * (s.h - 6)), mx = 2 * cx - x;
      if (Math.abs(x - cx) <= 1 || [x, mx].some(a => pil.some(([p, q]) => Math.abs(p - a) <= 1 && Math.abs(q - y) <= 1))) continue;
      pil.push([x, y], [mx, y]);
    }
    pil.forEach(([x, y]) => set(x, y, 1));
    const r = { i, y0, y1, cx: (cx + 0.5) * TS, type: s.type, who: s.who, down: door(y1), up: i < specs.length - 1 ? door(y0) : [], cleared: false, started: false };
    if (!s.who) { const [sprite, name] = pick(Object.values(TRAINERS).flat()); r.npc = { kind: 'gymtrainer', sprite, name, x: r.cx, y: (y0 + 1.8) * TS }; m.npcs.push(r.npc); }
    m.rooms.push(r);
    y1 = y0;
  });
  m.rooms[0].down.forEach(k => solid[k] = 0);
  furn('statue', cx - 2, th - 2); furn('statue', cx + 2, th - 2);
  // 이미 이긴 체육관은 문이 모두 열려 있다
  if (!league && player.beaten.has(region.gyms.indexOf(g))) {
    for (const r of m.rooms) { r.cleared = r.started = true; r.up.forEach(k => solid[k] = 0); if (r.npc) r.npc.defeated = true; }
    m.portal = gymPortal(m.rooms.at(-1));
  }
  return m;
}
// 관장 방 한가운데 아래쪽: 밟으면 체육관 밖 문 앞으로 나간다
const gymPortal = r => ({ x: r.cx, y: (r.y1 - 3.5) * TS });
const roomAt = ty => map.rooms?.find(r => ty >= r.y0 && ty <= r.y1);
const setDoors = (ks, open) => ks.forEach(k => map.solid[k] = open ? 0 : 4);

// 칸 종류: 1 장애물, 3 건물, 4 벽, 7 가구, 8 턱, 9 연못, 10 울타리
const flyBlock = v => v >= 3 && v <= 7;
const solidAt = (tx, ty, flying = false, down = false) => {
  if (tx < 0 || ty < 0 || tx >= map.tw || ty >= map.th) return true;
  const v = map.solid[ty * map.tw + tx];
  if (v === 8) return !flying && !down;   // 턱은 아래로 내려갈 때만 지나간다
  if (v === 9 || v === 10) return !flying;
  return flying ? flyBlock(v) : v > 0;
};
// 탄·광선·시야: 턱, 연못, 울타리 위로는 지나간다. ghost면 장애물도 통과
const shotBlocked = (tx, ty, ghost = false) => {
  if (tx < 0 || ty < 0 || tx >= map.tw || ty >= map.th) return true;
  const v = map.solid[ty * map.tw + tx];
  return v >= 8 ? false : ghost ? flyBlock(v) : v > 0;
};
const nodeAt = (x, y) => world.nodes[world.area[clamp(Math.floor(y / TS), 0, world.th - 1) * world.tw + clamp(Math.floor(x / TS), 0, world.tw - 1)]];

function circleHitsSolid(x, y, r, flying = false, down = false) {
  for (let ty = Math.floor((y - r) / TS); ty <= Math.floor((y + r) / TS); ty++)
    for (let tx = Math.floor((x - r) / TS); tx <= Math.floor((x + r) / TS); tx++) {
      if (!solidAt(tx, ty, flying, down)) continue;
      const nx = clamp(x, tx * TS, tx * TS + TS), ny = clamp(y, ty * TS, ty * TS + TS);
      if (Math.hypot(x - nx, y - ny) < r) return true;
    }
  return false;
}

// 두 점 사이에 장애물이 있으면 true. 지진 충격파를 바위 뒤에서 피하는 데 쓴다
function losBlocked(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  for (let s = 16; s < d - 8; s += 12) if (shotBlocked(Math.floor((x0 + (x1 - x0) * s / d) / TS), Math.floor((y0 + (y1 - y0) * s / d) / TS))) return true;
  return false;
}

// 축별로 움직이고 막히면 그 축만 되돌려서 장애물을 따라 미끄러지게 한다
function moveBody(a, dx, dy) {
  const onLedge = a === player && circleHitsSolid(a.x, a.y, a.r, a.flying) && !circleHitsSolid(a.x, a.y, a.r, a.flying, true);
  a.x += dx; if (circleHitsSolid(a.x, a.y, a.r, a.flying, onLedge)) a.x -= dx;
  a.y += dy; if (circleHitsSolid(a.x, a.y, a.r, a.flying, onLedge || (a === player && dy > 0))) a.y -= dy;
}
const clampBody = a => { a.x = clamp(a.x, a.r, map.tw * TS - a.r); a.y = clamp(a.y, a.r, map.th * TS - a.r); };

function unstick(a) {
  if (!circleHitsSolid(a.x, a.y, a.r, a.flying)) return;
  const cx = Math.floor(a.x / TS), cy = Math.floor(a.y / TS);
  for (let rad = 1; rad < 8; rad++) for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    const x = (cx + dx + 0.5) * TS, y = (cy + dy + 0.5) * TS;
    if (!circleHitsSolid(x, y, a.r, a.flying)) { a.x = x; a.y = y; return; }
  }
}

function wildPool(n) {
  const base = [...new Set(region.gyms.slice(0, Math.min(8, n.tier + 2)).flatMap(g => g.mobs))];
  const fit = base.filter(id => MON[id].types.some(t => KINDS[n.kind].pref?.includes(t)));
  return fit.length >= 2 ? fit : base;
}
const tierAt = n => Math.max(n.tier, player.beaten.size * 0.9);

function movesFor(m) {
  const list = m.types.flatMap(t => TYPE_MOVES[t]);
  if (!list.some(([k]) => k === 'charge')) list.push(['charge', '돌진']);
  if (!list.some(([k]) => k === 'jump')) list.push(['jump', m.flying ? '공중날기' : '누르기']);
  return list;
}

// rank: wild(야생) / trainer(트레이너) / boss(관장·사천왕) / legend(전설)
function spawnEnemy(m, x, y, rank, tier = 0) {
  const s = m.st, big = rank === 'boss' || rank === 'legend', w = m.box.x1 - m.box.x0;
  const base = { wild: s.hp / 8, trainer: s.hp / 8 * TRAINER_HP, boss: 20 + s.hp * 0.15, legend: 40 + s.hp * 0.3 }[rank], hp = base * hpMult(rank, tier);
  const e = { mon: m, x, y, hx: x, hy: y, rank, tier, hp, maxHp: hp, scale: big ? 2 : 1, r: big ? clamp(w * 0.6, 30, 52) : clamp(w * 0.3, 12, 20), flying: m.flying, seed: Math.random() * 10,
    flip: false, hit: 0, cd: 1 + Math.random(), turn: Math.random(), dir: randDir(), vx: 0, vy: 0, walk: 0, moving: false, burn: 0, burnTick: 0, slow: 0, stun: 0, frozen: 0,
    z: 0, fade: 0, act: null, lunge: 1 + Math.random() * 2, burst: 0, burstT: 0, shotStyle: pick(['single', 'fan', 'burst']), aggro: rank !== 'wild',
    moves: rank === 'wild' ? null : movesFor(m), speed: big ? 30 + s.speed * 0.6 : (40 + s.speed * 0.8) * (rank === 'wild' ? 1.15 : 1), shooter: !big && s['special-attack'] >= s.attack };
  if (rank === 'legend') e.aggro = false;  // 전설도 다가가야 덤빈다
  unstick(e); clampBody(e);
  return e;
}

// ---------- 진행: 경험치, 레벨, 진화, 돈 ----------
function gainExp(n) {
  const p = player;
  p.exp += Math.round(n * p.expMul);
  while (p.exp >= expNeed(p.level)) { p.exp -= expNeed(p.level); levelUp(); }
}

function levelUp() {
  const p = player;
  p.level++;
  withDelta(p => { p.dmg += 0.12; p.speed += 1; if (p.level % 3 === 0) { p.maxHp += 1; p.hp += 1; } });
  say(`레벨 ${p.level}!`, p.x, p.y - 80, '#8ff'); sfx('level');
  if (p.evo[0] && p.level >= p.evo[0].level) evolve();
}

function evolve() {
  const p = player, next = p.evo.shift(), m = MON[next.id];
  if (!m) return;
  const a = baseOf(p.mon), b = baseOf(m), old = p.mon.name;
  withDelta(p => { p.maxHp += b.hp - a.hp; p.hp += Math.max(0, b.hp - a.hp); p.dmg += b.dmg - a.dmg; p.speed += b.speed - a.speed; });
  p.mon = m; if (p.shiny) loadShiny(m);
  fx.push({ kind: 'evo', x: p.x, y: p.y, t: 1.2, max: 1.2 }); sfx('evolve');
  banner = { text: `축하합니다! ${old}는(은) ${m.name}(으)로 진화했다!`, t: 4 };
  ach('evolve');
}

function gainMoney(n, x, y) {
  const v = Math.round(n * player.moneyMul);
  player.money += v; sfx('coin');
  texts.push({ text: `+₽${v}`, x, y: y - 40, t: 0.9, color: '#fd6', size: 11 });
}

function newRun(m, shiny = false) {
  store.del(SAVE_KEY);
  taken = new Set(); texts = []; banner = null; dialog = null; fx = []; dayTime = 0;
  player = makePlayer(m); player.shiny = shiny; player.startId = m.id;
  // 전설의 포켓몬은 상징적인 기술을 갖고 시작한다
  // 전설이 아니면 타입에 맞는 기술머신 하나를 갖고 시작한다
  const first = LEGEND_MOVE[m.id] ?? typeMove(m);
  if (first) { taken.add(first); learnMove(first); }
  player.first = first ?? null;
  world = genWorld(Math.floor(Math.random() * 2 ** 31));
  map = world;
  [player.x, player.y] = world.start;
  player.rival = RIVALS[region.name] ? { starter: rivalStarter(), done: new Set(), legend: false } : null;
  resetCombat(); refreshFx(); renderBar();
  state = 'loading';
  Promise.all([loadEvo(m.id).catch(() => []), shiny && loadShiny(m)]).then(([evo]) => { player.evo = evo; state = 'play'; });
}

// ---------- 이어하기: 지도는 시드로 똑같이 다시 만들고, 그 위에 플레이어와 바뀐 것(주운 볼, 이긴 트레이너, 받은 선물...)만 덮어쓴다 ----------
const SAVE_KEY = 'pokemon-dungeon-save';
const loadSave = () => { const sv = store.get(SAVE_KEY); return sv?.v === 1 && REGIONS.some(r => r.name === sv.region) ? sv : null; };
const packContent = k => k.kind === 'tm' ? { kind: 'tm', tm: k.tm.id } : k.kind === 'item' ? { kind: 'item', item: k.item.id } : { kind: k.kind };
const unpackContent = k => k.kind === 'tm' ? { kind: 'tm', tm: moveDef(k.tm) } : k.kind === 'item' ? { kind: 'item', item: itemById(k.item) } : { kind: k.kind };

function saveRun() {
  const p = player;
  if (!p || !world || p.hp <= 0 || !['play', 'pause', 'map', 'shop', 'learn'].includes(state)) return false;
  if (map.battle && map === world) return false;  // 승부 중에는 저장하지 않는다 (도망치기 꼼수 방지)
  const prim = Object.fromEntries(Object.entries(p).filter(([, v]) => v === null || ['number', 'boolean', 'string'].includes(typeof v)));
  const [x, y] = map === world ? [p.x, p.y] : world.returnTo;
  const sv = {
    v: 1, region: region.name, seed: world.seed, dayTime, at: Date.now(), monName: p.mon.name,
    player: { ...prim, x, y, mon: p.mon.id, items: p.items.map(i => i.tm ? { m: i.id } : { i: i.id }), moves: [...p.moves], beaten: [...p.beaten], seen: [...p.seen],
      defeated: p.defeated, bought: p.bought, evo: p.evo, rival: p.rival && { ...p.rival, done: [...p.rival.done] } },
    taken: [...taken],
    pickups: world.pickups.filter(k => k.id).map(k => k.id),
    drops: world.pickups.filter(k => !k.id).map(k => ({ ...packContent(k), x: k.x, y: k.y, ball: !!k.ball })),
    npcs: world.npcs.filter(n => n.id >= 0).map(n => ({ id: n.id, defeated: !!n.defeated, gift: n.kind === 'gift' && !n.gift, sold: !!n.sold, healed: !!n.healed })),
    legends: world.legends.filter(l => l.done).map(l => l.i),
    visited: world.nodes.filter(n => n.visited).map(n => n.i),
  };
  return store.set(SAVE_KEY, sv);
}

async function continueRun() {
  const sv = loadSave();
  if (!sv) return;
  state = 'loading'; region = REGIONS.find(r => r.name === sv.region); probeBgm(region);
  try {
    await loadRegion(region);
    const sp = sv.player;
    await Promise.all([sp.startId, sp.mon, ...sp.evo.map(e => e.id)].map(loadMon));
    // 처음 판을 시작할 때와 똑같은 상태에서 지도를 만들어야 볼·선물 내용물이 같아진다
    taken = new Set(); texts = []; banner = null; dialog = null; fx = []; dayTime = sv.dayTime ?? 0;
    player = makePlayer(MON[sp.startId]);
    if (sp.first) { taken.add(sp.first); learnMove(sp.first); }
    world = genWorld(sv.seed);
    const p = player, { mon, items, moves, beaten, seen, defeated, bought, evo, rival, ...prim } = sp;
    Object.assign(p, prim);
    p.mon = MON[mon]; p.items = items.map(o => o.m ? moveDef(o.m) : itemById(o.i)).filter(Boolean);
    p.moves = new Set(moves); p.beaten = new Set(beaten); p.seen = new Set(seen); p.defeated = defeated; p.bought = bought; p.evo = evo;
    p.rival = rival && { ...rival, done: new Set(rival.done) };
    p.deltas = Array(STATS.length).fill(null);
    taken = new Set(sv.taken);
    const left = new Set(sv.pickups), byId = new Map(sv.npcs.map(n => [n.id, n]));
    world.pickups = [...world.pickups.filter(k => left.has(k.id)), ...sv.drops.map(d => ({ ...unpackContent(d), x: d.x, y: d.y, ball: d.ball })).filter(k => k.kind === 'berry' || k.tm || k.item)];
    for (const n of world.npcs) { const o = byId.get(n.id); if (!o) continue; if (o.defeated) n.defeated = true; if (o.gift) n.gift = null; if (o.sold) n.sold = true; if (o.healed) n.healed = true; }
    for (const i of sv.legends) world.legends[i].done = true;
    for (const i of sv.visited) world.nodes[i].visited = true;
    map = world;
    resetCombat(); refreshFx(); renderBar();
    if (p.shiny) await loadShiny(p.mon);
    banner = { text: `${region.name}지방 모험을 이어서 한다`, t: 2.5 };
    state = 'play';
  } catch (e) { loadError = `이어하기 실패: ${e.message}`; state = 'error'; }
}

function autoSave() { if (saveRun()) { sfx('save'); say('기록했다', player.x, player.y - 100, '#8cf'); } }

const resetCombat = () => { tears = []; beams = []; bombs = []; hazards = []; puddles = []; pstrikes = []; fx = fx ?? []; curNode = null; timeStop = 0; };

// ---------- 전투 ----------
function say(text, x, y, color = '#fff') {
  if (textCd > 0 && texts.some(t => t.text === text)) return;
  texts.push({ text, x, y, t: 1.2, color }); textCd = 0.3;
}

const heal = n => player.hp = Math.min(player.maxHp, player.hp + n);

function withDelta(fn) {
  const p = player, before = STATS.map(s => s[2](p));
  fn(p);
  STATS.forEach((s, i) => { const d = s[2](p) - before[i]; if (Math.abs(d) > 1e-6) p.deltas[i] = { v: d, t: 3 }; });
}

function hurt(type, amount = 1, src = null) {
  const p = player, who = src?.src ?? curEnemy, move = src?.move ?? who?.act?.name;
  if (p.inv > 0 || p.dash > 0 || p.vanish > 0 || state !== 'play') return;
  if (Math.random() < p.dodge) { p.inv = 0.5; return say('공격을 피했다!', p.x, p.y - 60, '#aef'); }
  const m = eff(type, p.mon.types);
  let d = m === 0 ? 0 : amount + (m > 1 ? 1 : 0);
  if (hasFx('bulwark') && d > 0) { d -= 1; if (d === 0 && Math.random() < 0.5) d = 1; if (d === 0) { p.inv = 0.5; return say('막아냈다!', p.x, p.y - 60, '#ccf'); } }
  p.inv = p.invTime; p.streak = 0; p.hits = (p.hits ?? 0) + 1;
  if (p.balloon && d > 0) { p.balloon = p.flying = false; say('풍선이 터졌다!', p.x, p.y - 80, '#f88'); unstick(p); }
  if (m > 1 && p.weaknessPolicy) { p.weaknessPolicy = false; withDelta(p => p.dmg += 0.6); say('약점보험 발동!', p.x, p.y - 90, '#ff8'); }
  if (d > 0) sfx('hurt');
  if (p.hp - d <= 0 && p.sash) { p.sash = false; p.hp = 1; say('기합의띠로 버텼다!', p.x, p.y - 60, '#ff8'); }
  else p.hp -= d;
  if (m > 1) say('효과가 굉장했다!', p.x, p.y - 60, '#f66');
  if (p.hp <= 0 && p.revive) { p.revive = false; p.hp = p.maxHp; banner = { text: '무지개깃털이 빛나며 다시 일어섰다!', t: 3 }; }
  if (p.hp <= 0) { p.cause = who ? `${who.rank === 'trainer' || who.rank === 'boss' ? '상대 ' : who.rank === 'legend' ? '전설의 포켓몬 ' : '야생 '}${who.mon.name}의 ${move ?? '공격'}` : `${TYPE_KO[type]} 타입 공격`; state = 'dead'; store.del(SAVE_KEY); ach('die'); checkAch(); }
}

const nearestEnemy = (x, y, except, maxD) => map.enemies.filter(e => e !== except && e.hp > 0 && !untargetable(e) && Math.hypot(e.x - x, e.y - y) < maxD)
  .sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0];
const enemiesNear = (x, y, rad, except) => map.enemies.filter(o => o !== except && o.hp > 0 && Math.hypot(o.x - x, o.y - y) < rad + o.r);

// tick: 광선처럼 짧은 간격으로 들어가는 피해. secondary: 다른 효과가 만든 피해라 또 연쇄하지 않음
function damage(e, base, type, tick = false, secondary = false, extraCrit = 0) {
  if (e.hp <= 0 || untargetable(e)) return;
  const p = player, raw = eff(type, e.mon.types), big = isBig(e);
  // shortcut: 면역(0배)도 0.25배로 처리해서 못 잡는 적이 없게 함. 기술을 골라 쓰게 되면 원작대로 0배로
  let d = base * Math.max(raw, 0.25) * (raw > 1 && p.expert ? 1.3 : 1) * (p.metronome ? 1 + Math.min(p.streak, 20) * 0.03 : 1) * (e.frozen > 0 ? 1.5 : 1)
    * (hasFx('blade') ? 1.5 * (big ? 1.4 : 1) : 1) * (hasFx('drain') ? 1.2 : 1) * (hasFx('madness') && big ? 1.25 : 1)
    * (has('brick-break') && e.rank !== 'wild' ? 1.3 : 1) * (has('flash-cannon') ? 1.2 : 1) * (has('focus-blast') ? 1.6 : 1) * (has('iron-head') ? 1.15 : 1)
    * (has('dragon-claw') ? 1.2 : 1) * (has('moonblast') && big ? 1.3 : 1) * legendPow;
  const crit = Math.random() < p.crit + extraCrit + (has('aerial-ace') ? 0.15 : 0) + (has('crunch') ? 0.05 : 0) + (has('stone-edge') ? 0.2 : 0);
  if (crit) d *= has('crunch') ? 2.2 : 1.5;
  e.hp -= d; e.hit = 0.1; e.aggro = true;
  if (!tick) sfx(crit ? 'crit' : 'hit');
  if (hasFx('drain') && (p.drain2 += d) >= 12) { p.drain2 -= 12; heal(1); }
  if (!tick) {
    const msg = crit ? '급소에 맞았다!' : raw > 1 ? '효과가 굉장했다!' : raw === 0 ? '효과가 없는 것 같다...' : raw < 1 ? '효과가 별로인 듯하다' : null;
    if (msg) say(msg, e.x, e.y - 70, raw > 1 ? '#ff4' : '#ccc');
  }
  if (secondary) return;
  p.streak++;
  const proc = tick ? 0.12 : 1;
  if (has('will-o-wisp') && Math.random() < proc) e.burn = 3;
  if (hasFx('holyBurn') && Math.random() < proc) { e.burn = 4; e.holy = true; }
  if (has('icy-wind') && Math.random() < proc) e.slow = 2;
  if (has('thunder-wave') && Math.random() < 0.25 * proc) { e.stun = 1; say('마비되었다!', e.x, e.y - 50, '#ff8'); }
  if (has('ice-beam') && Math.random() < 0.15 * proc) { e.frozen = 1; say('얼어붙었다!', e.x, e.y - 50, '#aef'); }
  if ((has('dark-pulse') && Math.random() < 0.2 * proc) || (has('iron-head') && Math.random() < 0.15 * proc)) { e.stun = 0.6; say('풀죽었다!', e.x, e.y - 50, '#ccc'); }
  if (hasFx('freeze') && Math.random() < 0.35 * proc) { e.frozen = 1.5; say('얼어붙었다!', e.x, e.y - 50, '#aef'); }
  if (p.kingsRock && Math.random() < 0.1 * proc) { e.stun = 0.8; say('풀죽었다!', e.x, e.y - 50, '#ccc'); }
  if (has('giga-drain') && (p.drain += d) >= 25) { p.drain -= 25; heal(1); say('체력을 흡수했다!', p.x, p.y - 60, '#8f8'); }
  if (has('sludge-bomb') && Math.random() < 0.35 * proc) puddles.push({ x: e.x, y: e.y, r: 40, t: 2.5, tick: 0 });
  if (has('rock-slide') && Math.random() < 0.3 * proc) for (let i = 0; i < 3; i++) pstrikes.push({ x: e.x + Math.random() * 100 - 50, y: e.y + Math.random() * 100 - 50, t: 0.4 + i * 0.1 });
  if (has('earthquake') && Math.random() < proc * 0.6) {
    fx.push({ kind: 'ring', x: e.x, y: e.y, t: 0.3, max: 0.3 });
    for (const o of enemiesNear(e.x, e.y, 90, e)) if (!o.flying) damage(o, p.dmg * 0.5, 'ground', false, true);
  }
  if (tick) return;
  if (has('thunderbolt')) {
    const o = nearestEnemy(e.x, e.y, e, 160);
    if (o) { damage(o, p.dmg * 0.6, 'electric', false, true); fx.push({ kind: 'zap', x: e.x, y: e.y, x2: o.x, y2: o.y, t: 0.15 }); }
  }
  if (has('dragon-pulse')) {
    fx.push({ kind: 'boom', x: e.x, y: e.y, r: 45, t: 0.2, max: 0.2, color: TYPE_COLOR.dragon });
    for (const o of enemiesNear(e.x, e.y, 45, e)) damage(o, p.dmg * 0.5, 'dragon', false, true);
  }
  // 전설의 기술 효과
  if (hasFx('smite') && Math.random() < 0.35) {
    damage(e, p.dmg * 2.5, 'electric', false, true);
    fx.push({ kind: 'zap', x: e.x, y: e.y - 220, x2: e.x, y2: e.y, t: 0.2 });
    for (const o of enemiesNear(e.x, e.y, 170, e).slice(0, 2)) { damage(o, p.dmg, 'electric', false, true); fx.push({ kind: 'zap', x: e.x, y: e.y, x2: o.x, y2: o.y, t: 0.2 }); }
  }
  if (hasFx('rend')) {
    fx.push({ kind: 'slash', x: e.x, y: e.y, t: 0.25, max: 0.25 });
    for (const o of enemiesNear(e.x, e.y, 110, e)) damage(o, p.dmg * 0.7, 'dragon', false, true);
  }
  if (hasFx('erupt') && p.eruptCd <= 0) {
    p.eruptCd = 0.35;
    const d0 = Math.hypot(e.x - p.x, e.y - p.y) || 1, ux = (e.x - p.x) / d0, uy = (e.y - p.y) / d0;
    for (let i = 0; i < 4; i++) pstrikes.push({ x: e.x + ux * 55 * i, y: e.y + uy * 55 * i, t: 0.08 + i * 0.1, r: 45, mul: 1.2, type: 'ground' });
  }
  if (hasFx('flare')) {
    fx.push({ kind: 'boom', x: e.x, y: e.y, r: 55, t: 0.25, max: 0.25, color: TYPE_COLOR.grass });
    for (const o of enemiesNear(e.x, e.y, 55, e)) damage(o, p.dmg * 0.8, 'grass', false, true);
  }
  if (hasFx('madness') && !big && e.hp > 0 && Math.random() < 0.2) { e.hp /= 2; say('자연의 분노!', e.x, e.y - 60, '#f9c'); }
}

function beamCfg() {
  let type = has('flamethrower') ? 'fire' : 'normal', mul = has('hyper-beam') ? 1.8 : 1, wm = has('hyper-beam') ? 1.4 : 1, cm = has('hyper-beam') ? 1.3 : 1, crit = 0;
  if (has('aeroblast')) { type = 'flying'; mul = Math.max(mul, 1.5); cm *= 0.5; crit = 0.3; }
  if (has('moongeist-beam')) { type = 'ghost'; mul = Math.max(mul, 2); }
  if (has('blue-flare')) { type = 'fire'; mul = Math.max(mul, 2.2); }
  if (has('eternabeam')) { type = 'dragon'; mul = Math.max(mul, 2.6); wm *= 1.8; cm *= 1.5; }
  return { type, mul, wm, cm, crit };
}
function carrier() { return has('egg-bomb') ? 'bomb' : has('flamethrower') || has('hyper-beam') || hasFx('beam') ? 'beam' : 'tear'; }
const shotScale = () => clamp(1 + (player.dmg * legendPow - 3) * 0.05, 1, 2);
const spread = () => has('pin-missile') ? [-0.26, 0, 0.26] : has('razor-leaf') ? [-0.12, 0.12] : [0];
const chargeTime = () => player.fireDelay * 2.2 * beamCfg().cm * (has('bullet-seed') ? 0.6 : 1);

function aimAngle(sd) {
  const p = player, e = has('swift') && nearestEnemy(p.x, p.y, null, 420);
  return e ? Math.atan2(e.y - p.y, e.x - p.x) : Math.atan2(sd[1], sd[0]);
}

function shootTear(a, extra = {}) {
  const p = player, sp = p.shotSpeed * (has('aerial-ace') ? 1.6 : 1), big = has('shadow-ball') || has('surf'), psy = hasFx('psy');
  tears.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: p.range, life0: p.range, r: ((big ? 11 : 7) + (hasFx('blade') ? 3 : 0)) * shotScale(), from: 'p', type: p.type,
    pierce: big || has('psychic') || psy || has('x-scissor'), ghost: has('shadow-ball') || p.ghostShot, boom: has('psychic'), home: psy ? 9 : has('swift') ? 5 : 0, hit: new Set(),
    mul: (has('bullet-seed') ? 0.55 : 1) * (psy ? 1.4 : 1) * (has('razor-leaf') && !has('pin-missile') ? 0.7 : 1), ...extra });
}

function attack(dt) {
  const p = player, kind = carrier();
  const sd = keys.ArrowUp ? [0, -1] : keys.ArrowDown ? [0, 1] : keys.ArrowLeft ? [-1, 0] : keys.ArrowRight ? [1, 0] : null;
  if (sd && sd[0]) p.flip = sd[0] > 0;
  if (sd) p.face = faceRow(sd[0], sd[1]);
  const waves = base => { if (hasFx('fan5')) for (const off of [-0.7, -0.35, 0.35, 0.7]) shootTear(base + off, { r: 11, pierce: true, type: 'water', mul: 0.8 }); };
  if (kind === 'beam') {
    // 혈사포처럼: 누르고 있으면 충전, 다 찬 상태에서 떼면 발사
    if (sd) { p.charge = Math.min(p.charge + dt, chargeTime()); p.aim = sd; return; }
    if (p.charge >= chargeTime()) {
      // 광선은 누른 방향으로 나가서 휘어 들어간다(beamPath). 처음부터 적을 조준하면 곧은 선이 된다
      const base = Math.atan2(p.aim[1], p.aim[0]), w = ((has('shadow-ball') ? 32 : 20) + (has('thunderbolt') ? 10 : 0)) * beamCfg().wm * shotScale();
      for (const off of spread()) beams.push({ a: base + off, t: 0.4, tick: 0, w });
      sfx('beam'); p.fired = true;
      waves(base);
    }
    p.charge = 0;
    return;
  }
  if (!sd || p.cd > 0) return;
  sfx('shot'); p.fired = true;
  const base = kind === 'bomb' ? aimAngle(sd) : Math.atan2(sd[1], sd[0]);
  for (const off of spread()) {
    const a = base + off;
    if (kind === 'bomb') {
      const target = has('swift') && nearestEnemy(p.x, p.y, null, 420), dist = target ? Math.hypot(target.x - p.x, target.y - p.y) : p.range * p.shotSpeed * 0.7;
      bombs.push({ sx: p.x, sy: p.y, x: p.x, y: p.y, z: 0, t: 0, dur: 0.55, tx: p.x + Math.cos(a) * dist, ty: p.y + Math.sin(a) * dist });
    } else shootTear(a);
  }
  waves(base);
  if (p.backShot && kind === 'tear') shootTear(base + Math.PI);
  if (has('dazzling-gleam') && ++p.shots % 4 === 0) for (let i = 0; i < 8; i++) shootTear(i / 8 * Math.PI * 2, { type: 'fairy', mul: 0.6 });
  p.cd = p.fireDelay * (kind === 'bomb' ? 1.8 : 1) * (has('bullet-seed') ? 0.5 : 1) * (has('focus-blast') ? 1.33 : 1);
}

// 플레이어 광선은 장애물을 지나가고 건물/벽에서 멈춘다. 적의 광선은 장애물에도 막혀서 숨으면 피할 수 있다
// 플레이어 광선 경로: 12px씩 나아가며, 유도 기술(스피드스타·사이코 계열)이 있으면 앞쪽의 가장 가까운 적으로 조금씩 휜다
function beamPath(b) {
  const p = player, home = b.ox === undefined && (has('swift') || hasFx('psy')) ? (hasFx('psy') ? 0.08 : 0.05) : 0;
  let x = b.ox ?? p.x, y = b.oy ?? p.y, a = b.a;
  const pts = [[x, y]];
  for (let s = 0; s < 520; s += 12) {
    const t = home && nearestEnemy(x, y, null, 260);
    if (t) { const d = ((Math.atan2(t.y - y, t.x - x) - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; if (Math.abs(d) < 1.6) a += clamp(d, -home, home); }
    x += Math.cos(a) * 12; y += Math.sin(a) * 12;
    if (shotBlocked(Math.floor(x / TS), Math.floor(y / TS), true)) break;
    pts.push([x, y]);
  }
  return pts;
}

function beamLen(ox, oy, dx, dy, blockedByObstacles = false) {
  for (let s = 0; s < 520; s += 12) if (shotBlocked(Math.floor((ox + dx * s) / TS), Math.floor((oy + dy * s) / TS), !blockedByObstacles)) return s;
  return 520;
}

function explode(b) {
  const rad = has('shadow-ball') ? 80 : 56;
  fx.push({ kind: 'boom', x: b.x, y: b.y - b.z * 0.5, r: rad, t: 0.25, max: 0.25 });
  for (const e of map.enemies) if (Math.hypot(e.x - b.x, e.y - b.y) < rad + e.r) damage(e, player.dmg * 2.5 * (has('bullet-seed') ? 0.55 : 1), 'normal');
  if (has('flamethrower') || has('hyper-beam') || hasFx('beam')) for (let i = 0; i < 4; i++) beams.push({ ox: b.x, oy: b.y, a: i * Math.PI / 2, t: 0.3, tick: 0, w: 16 });
}

function enemyShot(e, a, speed) {
  if (player.lagTail) speed *= 0.7;
  tears.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 3, r: 6, from: 'e', type: e.mon.types[0], src: e, move: e.act?.name });
}

// 플레이어 주변 41x29칸만 BFS 거리 지도를 만든다. 땅 위의 적은 거리가 줄어드는 칸으로 걸어서 장애물을 돌아간다
const FW = 41, FH = 29, flowD = new Int16Array(FW * FH);
let flowOx = 0, flowOy = 0;
function buildFlow() {
  flowOx = Math.floor(player.x / TS) - 20; flowOy = Math.floor(player.y / TS) - 14;
  flowD.fill(-1); flowD[14 * FW + 20] = 0;
  const q = [[20, 14]];
  for (let i = 0; i < q.length; i++) {
    const [c, r] = q[i];
    for (const [dx, dy] of DIRS8) {
      const nc = c + dx, nr = r + dy, k = nr * FW + nc;
      if (nc < 0 || nr < 0 || nc >= FW || nr >= FH || flowD[k] >= 0 || solidAt(nc + flowOx, nr + flowOy)) continue;
      if (dx && dy && (solidAt(c + dx + flowOx, r + flowOy) || solidAt(c + flowOx, r + dy + flowOy))) continue;  // 대각선으로 모서리 뚫기 금지
      flowD[k] = flowD[r * FW + c] + 1; q.push([nc, nr]);
    }
  }
}

function pathDir(e) {
  const p = player, dist = Math.hypot(p.x - e.x, p.y - e.y) || 1, direct = [(p.x - e.x) / dist, (p.y - e.y) / dist];
  const c = Math.floor(e.x / TS) - flowOx, r = Math.floor(e.y / TS) - flowOy;
  if (c < 0 || r < 0 || c >= FW || r >= FH || flowD[r * FW + c] <= 1) return direct;
  let best = null, bv = flowD[r * FW + c];
  for (const [dx, dy] of DIRS8) {
    const nc = c + dx, nr = r + dy;
    if (nc < 0 || nr < 0 || nc >= FW || nr >= FH) continue;
    const v = flowD[nr * FW + nc];
    if (v < 0 || v >= bv) continue;
    if (dx && dy && (solidAt(c + dx + flowOx, r + flowOy) || solidAt(c + flowOx, r + dy + flowOy))) continue;
    bv = v; best = [nc, nr];
  }
  if (!best) return direct;
  const tx = (best[0] + flowOx + 0.5) * TS, ty = (best[1] + flowOy + 0.5) * TS, d2 = Math.hypot(tx - e.x, ty - e.y) || 1;
  return [(tx - e.x) / d2, (ty - e.y) / d2];
}

const aimAt = (a, e) => { const p = player, d = Math.hypot(p.x - e.x, p.y - e.y) || 1; a.dx = (p.x - e.x) / d; a.dy = (p.y - e.y) / d; };
const cooldown = e => ({ wild: 2.5, trainer: 1.6, boss: 0.9, legend: 0.6 }[e.rank]) * (e.hp < e.maxHp / 2 ? 0.7 : 1) + Math.random() * 0.5;
const isBig = e => e.rank === 'boss' || e.rank === 'legend';

function turnToward(cur, want, max) {
  const diff = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return cur + clamp(diff, -max, max);
}

// 기술 시작: 이름을 띄우고 패턴별 준비를 한다. 모든 패턴은 피할 수 있도록 먼저 예고(조준선/낙하 지점/표식)를 보여준다
function startAct(e, [kind, name], opts = {}) {
  const p = player, type = e.mon.types[0];
  if (name) say(`${e.mon.name}의 ${name}!`, e.x, e.y - bodyH(e, e.scale) - 24, TYPE_COLOR[type]);
  const a = e.act = { kind, name, type, t: 0, phase: 0, ...opts };
  if (kind === 'charge') { a.reps ??= name === '역린' ? 3 : 1; a.wind ??= 0.6; a.dur ??= 0.7; a.speed ??= e.rank === 'trainer' ? 380 : 470; aimAt(a, e); }
  if (kind === 'beam') a.ang = Math.atan2(p.y - e.y, p.x - e.x);
  if (kind === 'strike') for (let i = 0; i < (e.rank === 'trainer' ? 2 : 4); i++) hazards.push({ kind: 'strike', type, r: 38, t: 0.9 + i * 0.15, src: e, move: name,
    x: p.x + (i ? Math.random() * 180 - 90 : 0), y: p.y + (i ? Math.random() * 180 - 90 : 0) });
}

function land(e) {
  const p = player;
  fx.push({ kind: 'ring', x: e.x, y: e.y, t: 0.35, max: 0.35 }); shake = 0.2;
  if (Math.hypot(p.x - e.x, p.y - e.y) < e.r + 55) hurt(e.mon.types[0], isBig(e) ? 2 : 1);
  if (isBig(e)) for (let i = 0, off = Math.random(); i < 8; i++) enemyShot(e, (i / 8 + off) * Math.PI * 2, 160);
}

function updateAct(e, dt) {
  const a = e.act, p = player, next = () => { a.phase++; a.t = 0; }, end = () => { e.act = null; e.cd = cooldown(e); };
  a.t += dt;
  if (a.kind === 'charge') {
    if (a.phase === 0) { if (a.t >= a.wind) next(); return; }
    const ox = e.x, oy = e.y;
    moveBody(e, a.dx * a.speed * dt, a.dy * a.speed * dt); clampBody(e);
    e.walk += a.speed * dt; e.moving = true; if (Math.abs(a.dx) > 0.1) e.flip = a.dx > 0;
    const blocked = Math.hypot(e.x - ox, e.y - oy) < a.speed * dt * 0.5;
    if (blocked || a.t >= a.dur) {
      if (blocked && isBig(e)) { fx.push({ kind: 'poof', x: e.x, y: e.y, t: 0.3, max: 0.3 }); shake = 0.15; }
      if (--a.reps > 0) { aimAt(a, e); a.phase = 0; a.t = 0; a.wind = 0.3; } else end();
    }
  } else if (a.kind === 'jump') {
    if (a.phase === 0) {
      if (a.t >= 0.4) { a.sx = e.x; a.sy = e.y; a.tx = p.x; a.ty = p.y; next(); }
    } else if (a.phase === 1) {
      const k = Math.min(a.t / 0.9, 1);
      e.x = a.sx + (a.tx - a.sx) * k; e.y = a.sy + (a.ty - a.sy) * k; e.z = Math.sin(k * Math.PI) * 150;
      if (a.tx !== a.sx) e.flip = a.tx > a.sx;
      if (k >= 1) { e.z = 0; unstick(e); land(e); next(); }
    } else if (a.t >= 0.45) end();
  } else if (a.kind === 'beam') {
    if (a.phase === 0) { if (a.t < 0.45) a.ang = turnToward(a.ang, Math.atan2(p.y - e.y, p.x - e.x), 1.8 * dt); if (a.t >= 0.85) next(); return; }
    if (a.t >= 0.5) return end();
    const dx = Math.cos(a.ang), dy = Math.sin(a.ang), rx = p.x - e.x, ry = p.y - e.y, s = rx * dx + ry * dy;
    if (s > 0 && s < beamLen(e.x, e.y, dx, dy, true) && Math.abs(rx * dy - ry * dx) < 14 + p.r) hurt(a.type);
  } else if (a.kind === 'strike') {
    if (a.t >= 0.7) end();
  } else if (a.kind === 'quake') {
    if (a.phase === 0) { if (a.t >= 0.35) { hazards.push({ kind: 'quake', x: e.x, y: e.y, R: e.r, type: a.type, hit: false, src: e, move: a.name }); shake = 0.25; next(); } }
    else if (a.t >= 0.4) end();
  } else if (a.kind === 'radial') {
    if (a.t >= a.phase * 0.35) { const n = e.rank === 'trainer' ? 8 : 12, off = Math.random(); for (let i = 0; i < n; i++) enemyShot(e, (i / n + off) * Math.PI * 2, 170); a.phase++; }
    if (a.phase >= 2) end();
  } else if (a.kind === 'fan') {
    if (a.t >= a.phase * 0.28) { const n = e.rank === 'trainer' ? 3 : 5, base = Math.atan2(p.y - e.y, p.x - e.x); for (let i = 0; i < n; i++) enemyShot(e, base + (i - (n - 1) / 2) * 0.22, 220); a.phase++; }
    if (a.phase >= 3) end();
  } else if (a.kind === 'spiral') {
    if ((a.next = (a.next ?? 0) - dt) <= 0) { a.next = 0.07; a.rot = (a.rot ?? Math.random() * 6) + 0.45; enemyShot(e, a.rot, 170); if (e.rank !== 'trainer') enemyShot(e, a.rot + Math.PI, 170); }
    if (a.t >= 1.6) end();
  } else if (a.kind === 'teleport') {
    if (a.phase === 0) {
      e.fade = Math.min(1, a.t / 0.35);
      if (a.t >= 0.35) { const ang = Math.random() * Math.PI * 2; e.x = p.x + Math.cos(ang) * 130; e.y = p.y + Math.sin(ang) * 130; clampBody(e); unstick(e); next(); }
    } else if (a.phase === 1) {
      e.fade = 1 - Math.min(1, a.t / 0.3);
      if (a.t >= 0.3) { e.fade = 0; const base = Math.atan2(p.y - e.y, p.x - e.x); for (let i = 0; i < 5; i++) enemyShot(e, base + (i - 2) * 0.2, 230); next(); }
    } else if (a.t >= 0.3) end();
  }
}

function wildShot(e) {
  const p = player, a = Math.atan2(p.y - e.y, p.x - e.x);
  if (e.shotStyle === 'fan') for (const o of [-0.3, 0, 0.3]) enemyShot(e, a + o, 190);
  else if (e.shotStyle === 'burst') { enemyShot(e, a, 220); e.burst = 2; e.burstT = 0.15; }
  else enemyShot(e, a, 210);
}

function contact(e) {
  const p = player;
  if (untargetable(e) || Math.hypot(p.x - e.x, p.y - e.y) >= e.r + p.r - 4) return;
  if ((p.rockyHelmet || hasFx('bulwark')) && p.inv <= 0 && p.dash <= 0) damage(e, p.dmg * (hasFx('bulwark') ? 3 : 2), 'steel', false, true);
  hurt(e.mon.types[0], e.act?.kind === 'charge' && e.act.phase === 1 && isBig(e) ? 2 : 1);
}

// 마을(체육관·리그 마을 포함)의 반듯한 광장 안쪽. 야생은 여기로 들어오지 못한다
function inTown(x, y) {
  if (map !== world) return false;
  const n = nodeAt(x, y), tx = Math.floor(x / TS), ty = Math.floor(y / TS);
  return (n.kind === 'T' || !!n.gym || n.league) && Math.abs(tx - n.tx) <= n.hx + 1 && Math.abs(ty - n.ty) <= n.hy + 1;
}

let curEnemy = null;  // 지금 행동 중인 적: 그 사이에 맞으면 이 적이 때린 것
function updateEnemy(e, dt) {
  const ox = e.x, oy = e.y;
  curEnemy = e; updateEnemyInner(e, dt); curEnemy = null;
  // 야생·전설이 마을 경계를 넘으려 하면 막고, 쫓기를 그만두고 제자리로 돌아가게 한다
  if ((e.rank === 'wild' || e.rank === 'legend') && !e.battle && inTown(e.x, e.y) && !inTown(ox, oy)) {
    e.x = ox; e.y = oy; e.aggro = false; e.leash = 2; e.act = null; e.vx = e.vy = 0;
  }
}

function updateEnemyInner(e, dt) {
  const p = player;
  e.cd -= dt; e.hit -= dt; e.slow -= dt; e.stun -= dt;
  if (e.burn > 0) { e.burn -= dt; if ((e.burnTick -= dt) <= 0) { e.burnTick = 0.5; damage(e, p.dmg * 0.3 * (e.holy ? 2 : 1), 'fire', true, true); } }
  if (e.burst > 0 && (e.burstT -= dt) <= 0) { enemyShot(e, Math.atan2(p.y - e.y, p.x - e.x), 220); e.burst--; e.burstT = 0.15; }
  e.moving = false;
  if (e.frozen > 0) { e.frozen -= dt; return; }
  if (e.stun > 0) return;
  if (e.aggro || e.act) e.face = faceRow(p.x - e.x, p.y - e.y);
  if (e.act) { updateAct(e, dt); contact(e); return; }
  const spd = e.speed * (e.slow > 0 ? 0.5 : 1), dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy) || 1;
  // 야생·전설은 가까이 오거나 맞기 전까지는 제 영역을 어슬렁거린다.
  // 플레이어가 멀어지거나 제 영역에서 너무 끌려 나오면 쫓기를 그만두고 돌아간다 (2초 동안은 다시 쫓지 않는다)
  if ((e.rank === 'wild' || e.rank === 'legend') && ((map.battle && !e.battle) || inTown(p.x, p.y))) { e.aggro = false; e.leash = 2; e.act = null; }
  else if (e.rank === 'wild' || e.rank === 'legend') {
    if (dist > 750 || Math.hypot(e.x - e.hx, e.y - e.hy) > 900) { e.aggro = false; e.leash = 2; }
    else if ((e.leash = (e.leash ?? 0) - dt) <= 0 && dist < 520) e.aggro = true;
  }
  let w = [0, 0], k = 1;
  if (!e.aggro) {
    if ((e.turn -= dt) <= 0) { const hd = Math.hypot(e.hx - e.x, e.hy - e.y); e.dir = hd > 200 ? [(e.hx - e.x) / hd, (e.hy - e.y) / hd] : Math.random() < 0.4 ? [0, 0] : randDir(); e.turn = 1 + Math.random() * 2; }
    w = e.dir; k = 0.35;
  } else if (e.rank !== 'wild') {
    if (e.cd <= 0) return startAct(e, pick(e.moves));
    w = e.flying ? [dx / dist, dy / dist] : pathDir(e); k = 0.7;
  } else if (!e.shooter) {
    w = e.flying ? [dx / dist, dy / dist] : pathDir(e);
    // 가까워지면 몸을 움츠렸다가 짧게 덮친다
    if ((e.lunge -= dt) <= 0 && dist < 190) { e.lunge = 1.2 + Math.random() * 1.2; return startAct(e, ['charge', null], { wind: 0.3, dur: 0.3, speed: 400 }); }
  } else if (e.flying) {
    if ((e.turn -= dt) <= 0) { e.dir = dist > 300 ? [dx / dist, dy / dist] : randDir(); e.turn = 1 + Math.random() * 1.5; }
    w = e.dir;
    if (e.cd <= 0) { wildShot(e); e.cd = 1.2; }
  } else {
    // 땅 위의 원거리형: 걷다가 멈춰서 조준한 뒤 쏜다
    e.turn -= dt;
    if (e.turn > 0) w = dist > 320 ? pathDir(e) : e.dir;
    else if (e.turn < -0.5) { wildShot(e); e.dir = randDir(); e.turn = 0.6 + Math.random() * 0.8; }
  }
  let mx, my;
  if (e.flying) {
    // 관성 있는 비행 + 진행 방향 옆으로 흔들림
    const kk = Math.min(1, dt * 2.5), wob = Math.sin(now * 3 + e.seed) * spd * 0.35 * k;
    e.vx += (w[0] * spd * k - e.vx) * kk; e.vy += (w[1] * spd * k - e.vy) * kk;
    mx = (e.vx - w[1] * wob) * dt; my = (e.vy + w[0] * wob) * dt;
  } else { mx = w[0] * spd * k * dt; my = w[1] * spd * k * dt; }
  const ox = e.x, oy = e.y;
  moveBody(e, mx, my); clampBody(e);
  const moved = Math.hypot(e.x - ox, e.y - oy);
  e.walk += moved; e.moving = moved > 0.1;
  if (Math.abs(mx) > 0.05) e.flip = mx > 0;
  if (!e.aggro && e.moving) e.face = faceRow(mx, my);
  if (e.aggro) contact(e);
}

// 플레이어 주변에서 야생 포켓몬이 계속 다시 나타난다. 마을과 건물 안은 안전 지대
function manageSpawns(dt) {
  if (map.battle) return;  // 트레이너·라이벌과 승부하는 동안에는 야생이 새로 나오지 않는다
  if ((spawnCd -= dt) > 0 || (spawnT -= dt) > 0) return;
  spawnT = 0.4;
  const p = player, wild = map.enemies.filter(e => e.rank === 'wild');
  for (const e of wild) if (Math.hypot(e.x - p.x, e.y - p.y) > 1400) e.gone = true;
  const here = nodeAt(p.x, p.y), near = wild.filter(e => !e.gone && Math.hypot(e.x - p.x, e.y - p.y) < 900).length;
  if (near >= 6 + Math.floor(tierAt(here) / 2)) return;
  for (let tries = 0; tries < 24; tries++) {
    const a = Math.random() * Math.PI * 2, d = 480 + Math.random() * 280, x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
    const tx = Math.floor(x / TS), ty = Math.floor(y / TS), k = ty * world.tw + tx;
    if (tx < 0 || ty < 0 || tx >= world.tw || ty >= world.th || !world.reach[k] || world.solid[k]) continue;
    const n = nodeAt(x, y);
    if (n.kind === 'T' || n.gym || n.league) continue;
    if ((n.kind === 'R' || n.kind === 'F') && !world.grass[k]) continue;  // 도로와 숲에서는 원작처럼 풀숲에서만 나온다
    const e = spawnEnemy(MON[pick(wildPool(n))], x, y, 'wild', tierAt(n));
    if (Math.random() < SHINY_RATE) { e.shiny = true; loadShiny(e.mon); banner = { text: `앗! 색이 다른 ${e.mon.name}이(가) 나타났다!`, t: 3 }; }
    map.enemies.push(e);
    return;
  }
}

function checkLegends() {
  const p = player;
  for (const l of world.legends) {
    if (l.done || l.alive || Math.hypot(p.x - l.x, p.y - l.y) > 520) continue;
    const e = spawnEnemy(MON[l.id], l.x, l.y, 'legend', nodeAt(l.x, l.y).tier);
    e.legend = l; l.alive = true;
    map.enemies.push(e);
    banner = { text: `앗! 야생의 ${MON[l.id].name}이(가) 나타났다!`, t: 3 }; sfx('legend');
  }
}

function onKill(e) {
  const p = player;
  fx.push({ kind: 'poof', x: e.x, y: e.y, t: 0.3, max: 0.3 });
  sfx(isBig(e) ? 'boss' : 'faint');
  p.seen.add(e.mon.id); p.defeated[e.mon.id] = (p.defeated[e.mon.id] ?? 0) + 1;
  if (!DEX.has(e.mon.id)) { DEX.add(e.mon.id); p.newDex = (p.newDex ?? 0) + 1; store.set(DEX_KEY, [...DEX]); say(`${e.mon.name} 도감 등록!`, e.x, e.y - 90, '#8cf'); }
  const sb = starterBase(e.mon.id);
  if (sb && !STARTERS.has(sb)) {
    STARTERS.add(sb); store.set(STARTER_KEY, [...STARTERS]); (p.newStarters ??= []).push(sb);
    banner = { text: `${MON[sb]?.name ?? e.mon.name}을(를) 다음 판부터 스타팅으로 고를 수 있다!`, t: 3.5, glow: '#8cf' };
  }
  if (e.shiny) {
    if (!SHINY.has(e.mon.id)) { SHINY.add(e.mon.id); store.set(SHINY_KEY, [...SHINY]); }
    ach('shiny');
    banner = { text: sb || LEGEND_MOVE[e.mon.id] ? `색이 다른 ${e.mon.name}을(를) 쓰러뜨렸다! 다음 판부터 이로치로 시작할 수 있다` : `색이 다른 ${e.mon.name}을(를) 쓰러뜨렸다!`, t: 4 };
    map.pickups.push({ ...rollContent(Math.random, { tm: 0.3, ltm: 0.05, c: 0, r: 0.6, l: 0.4 }), x: e.x, y: e.y + 30, ball: true });
  }
  if (p.bigRoot && Math.random() < 0.1) heal(1);
  if (p.shellBell && Math.random() < 0.15) heal(1);
  if (hasFx('flare') && Math.random() < 0.2) heal(1);
  if (hasFx('holyBurn') && e.burn > 0) {
    fx.push({ kind: 'boom', x: e.x, y: e.y, r: 80, t: 0.3, max: 0.3, color: TYPE_COLOR.fire });
    for (const o of enemiesNear(e.x, e.y, 80, e)) damage(o, p.dmg * 1.5, 'fire', false, true);
  }
  const t = e.tier;
  // 경험치도 단계마다 2배: 초반 잡몹은 4, 마지막 단계 잡몹은 500쯤
  gainExp(4 * 2 ** t * { wild: 1, trainer: 2.5, boss: 8, legend: 25 }[e.rank]);
  if (e.rank === 'wild') {
    spawnCd = 4;  // 잡고 나면 4초 동안은 새로 나오지 않는다
    gainMoney((5 + t * 6) * (0.6 + Math.random() * 0.8), e.x, e.y);
    const roll = Math.random();
    if (roll < 0.04) map.pickups.push({ ...rollContent(Math.random, { tm: 0.15, ltm: 0.01, c: 0.8, r: 0.2, l: 0 }), x: e.x, y: e.y, ball: true });
    else if (roll < 0.07) map.pickups.push({ kind: 'berry', x: e.x, y: e.y });
  }
  if (e.rank === 'legend') {
    const ids = loadUnlocked();
    if (!ids.includes(e.mon.id)) { store.set(LEGEND_KEY, [...ids, e.mon.id]); (p.newStarters ??= []).push(e.mon.id); }
    if (e.legend) { e.legend.done = true; e.legend.alive = false; }
    if (p.rival) p.rival.legend = true;
    ach('legend1');
    gainMoney(3000, e.x, e.y);
    banner = { text: `${e.mon.name}을(를) 쓰러뜨렸다! 다음 판부터 ${e.mon.name}(으)로 시작할 수 있다`, t: 4 };
    // 쓰러뜨린 전설의 상징 기술이 기술머신으로 떨어진다
    const sig = LTMS.find(t => t.id === LEGEND_MOVE[e.mon.id]);
    if (sig && !taken.has(sig.id) && !p.moves.has(sig.id)) { taken.add(sig.id); map.pickups.push({ kind: 'tm', tm: sig, x: e.x - 40, y: e.y }); }
    map.pickups.push({ ...rollContent(Math.random, { c: 0, r: 0, l: 1 }), x: e.x + 40, y: e.y });
  }
}

// ---------- 승부 (트레이너, 관장, 사천왕) ----------
function startBattle(b) {
  map.battle = { wait: 1, ...b };
  sfx('battle');
  // 필드 승부: 가까운 야생은 놀라서 달아나고, 나머지는 승부가 끝날 때까지 덤비지 않는다
  if (map === world) {
    const p = player, near = map.enemies.filter(e => e.rank === 'wild' && Math.hypot(e.x - p.x, e.y - p.y) < 650);
    for (const e of near) fx.push({ kind: 'poof', x: e.x, y: e.y, t: 0.3, max: 0.3 });
    map.enemies = map.enemies.filter(e => !near.includes(e));
    for (const e of map.enemies) if (e.rank === 'wild' || e.rank === 'legend') { e.aggro = false; e.act = null; e.leash = 3; }
  }
  banner = { text: `${b.title ? `${b.title} ` : ''}${b.who}이(가) 승부를 걸어왔다!`, t: 2.5 };
}

function startTrainer(n) {
  const p = player;
  const team = Array.from({ length: 1 + Math.floor(Math.random() * 2) + (n.node.tier > 3 ? 1 : 0) }, () => pick(wildPool(n.node)));
  n.fighting = true;
  startBattle({ who: n.name, queue: team, x: n.x, y: n.y, rank: 'trainer', tier: tierAt(n.node), npc: n, onWin: () => {
    n.fighting = false; n.defeated = true; p.trainerWins = (p.trainerWins ?? 0) + 1;
    gainMoney(150 + n.node.tier * 150, n.x, n.y);
    banner = { text: `${n.name}에게 이겼다!`, t: 2 };
    map.pickups.push({ ...rollContent(Math.random, { tm: 0.3, ltm: 0.04, c: 0.4, r: 0.55, l: 0.05 }), x: n.x, y: n.y + 40, ball: true });
  } });
}

// ---------- 첫 판 안내: 해 보면 다음으로 넘어간다. 끝나거나 H 키로 끄면 다시 나오지 않는다 ----------
const TUT_KEY = 'pokemon-dungeon-tutorial';
let tutDone = !!store.get(TUT_KEY);
const TUT = [
  { key: '이동', pc: 'WASD로 걸어 보세요', touch: '왼쪽 스틱으로 걸어 보세요', done: p => p.walk > 240 },
  { key: '공격', pc: '방향키(↑↓←→)를 누르면 그 방향으로 기술을 쏩니다', touch: '오른쪽 스틱을 민 방향으로 기술을 쏩니다', done: p => p.fired },
  { key: '구르기', pc: 'Space로 구르기: 구르는 동안은 공격을 맞지 않습니다', touch: '구르기 버튼: 구르는 동안은 공격을 맞지 않습니다', done: p => p.dashed },
  { key: '대화', pc: '사람 앞에서 E로 말 걸기 (간호순: 회복과 기록, 점원: 상점)', touch: '사람 앞에서 A 버튼으로 말 걸기 (간호순: 회복과 기록, 점원: 상점)', done: p => p.talked },
  { key: '지도·메뉴', pc: 'M = 지도, Esc = 메뉴 (도감·가방·설정)', touch: '지도 버튼 = 지도, B 버튼 = 메뉴 (도감·가방·설정)', done: p => p.opened },
  { key: '목표', pc: '풀숲에는 야생 포켓몬! 체육관 배지 8개를 모아 포켓몬리그의 챔피언이 되세요', touch: '풀숲에는 야생 포켓몬! 체육관 배지 8개를 모아 포켓몬리그의 챔피언이 되세요', done: p => p.time - (p.tutGoalAt ??= p.time) > 6 },
];
const tutStep = () => tutDone || !player ? null : TUT.findIndex(s => !s.done(player));
function tickTutorial() {
  if (tutDone || !player) return;
  if (tutStep() < 0) { tutDone = true; store.set(TUT_KEY, true); sfx('select'); }
}
function drawTutorial() {
  const i = tutStep();
  if (i === null || i < 0) return;
  const st = TUT[i], w = 560, x = SIDE + (W - w) / 2, y = HUD + 10;
  ctx.fillStyle = 'rgba(10,14,30,.88)'; ctx.fillRect(x, y, w, 52); ctx.strokeStyle = '#8cf'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, 50);
  text(`안내 ${i + 1}/${TUT.length} · ${st.key}`, x + 12, y + 19, 11, '#8cf', 'left');
  text(TOUCH ? '' : 'H = 안내 끄기', x + w - 12, y + 19, 10, '#678', 'right');
  glowText(TOUCH ? st.touch : st.pc, x + w / 2, y + 41, 13, '#fff', '#4af');
  if (TOUCH) taps.push({ x: x + w - 60, y, w: 60, h: 24, fn: skipTutorial });
  if (TOUCH) text('안내 끄기', x + w - 12, y + 19, 10, '#678', 'right');
}
const skipTutorial = () => { tutDone = true; store.set(TUT_KEY, true); };

// ---------- 라이벌 ----------
// 라이벌 스타팅: 플레이어 스타팅(풀·불꽃·물 순)에 상성이 좋은 쪽. 스타팅이 아니면 무작위
function rivalStarter() {
  const id = player.mon.id, i = region.starters.findIndex(s => id >= s && id <= s + 2);
  return region.starters[i >= 0 ? (i + 1) % 3 : Math.floor(Math.random() * 3)];
}

// 배지가 많을수록 마릿수가 늘고 진화한다. 마지막(에이스)은 늘 스타팅
function rivalTeam(badges) {
  const [, , mates] = RIVALS[region.name], s = player.rival.starter + (badges >= 6 ? 2 : badges >= 2 ? 1 : 0);
  const n = clamp(Math.ceil(badges / 2), 0, mates.length);
  return [...mates.slice(0, n).map(([a, b]) => badges >= 4 ? b : a), s].filter(id => MON[id]);
}

function rivalDue() {
  const p = player, r = p.rival, b = p.beaten.size, at = curNode;
  if (!r.done.has('start')) { const i = tutStep(); return i === null || i < 0 || i >= 3 ? 'start' : null; }
  // 배지 이벤트는 가장 최근 것 하나만. 앞의 것을 놓쳤으면 건너뛴다
  const badge = ['b7', 'b5', 'b3'].find(ev => b >= +ev.slice(1) && !r.done.has(ev));
  if (badge) { ['b3', 'b5', 'b7'].forEach(ev => +ev.slice(1) <= +badge.slice(1) && r.done.add(ev)); r.done.delete(badge); return badge; }
  if (r.legend && !r.done.has('legend')) return 'legend';
  if (b >= region.gyms.length && !r.done.has('road') && at && (at.league || at.name.includes('챔피언로드'))) return 'road';
  return null;
}

function rivalCheck() {
  const p = player, r = p.rival;
  if (!r || map !== world || map.battle) return;
  const here = world.npcs.find(n => n.rival);
  if (here) { if (!here.defeated && Math.hypot(here.x - p.x, here.y - p.y) > 2200) world.npcs = world.npcs.filter(n => n !== here); return; }
  const ev = rivalDue();
  if (!ev) return;
  const [name, sprite] = RIVALS[region.name], ang = Math.random() * Math.PI * 2;
  const n = { id: -1, kind: 'trainer', rival: ev, sprite, name, x: p.x + Math.cos(ang) * 230, y: p.y + Math.sin(ang) * 230, r: 14, dir: [0, 0], turn: 0, node: curNode };
  unstick(n); clampBody(n); n.hx = n.x; n.hy = n.y;
  world.npcs.push(n);
  banner = { text: `라이벌 ${name}이(가) 다가온다!`, t: 2.5 };
}

function startRival(n) {
  const p = player, b = p.beaten.size, [hi, bye] = RIVAL_TALK[n.rival];
  n.fighting = true; n.flip = p.x > n.x;
  startBattle({ who: n.name, title: '라이벌', queue: rivalTeam(b), x: n.x, y: n.y, rank: b ? 'boss' : 'trainer', tier: clamp(b - 1, 0, 7), npc: n, rival: true, wait: 2.5,
    say: (i, ace) => ace && i > 0 ? '아직 끝나지 않았어! 내 파트너, 가자!' : i === 0 ? hi : null, onWin: () => {
    n.fighting = false; n.defeated = true; n.leaveT = 5; p.rival.done.add(n.rival);
    ach('rival1'); if (RIVAL_EVENTS.every(ev => p.rival.done.has(ev))) ach('rival6');
    gainMoney(b ? 1200 + b * 500 : 300, n.x, n.y);
    dialog = { name: n.name, text: bye, t: 5 };
    banner = { text: `라이벌 ${n.name}에게 이겼다!`, t: 2.5 };
    map.pickups.push({ ...rollContent(Math.random, { tm: 0.45, ltm: b >= 5 ? 0.12 : 0.05, c: b ? 0 : 0.5, r: 0.6, l: b >= 5 ? 0.4 : 0.1 }), x: n.x, y: n.y + 40, ball: true });
  } });
}

function enterBuilding(b) {
  const p = player;
  if (b.kind === 'league' && p.beaten.size < region.gyms.length) return say(`배지가 ${region.gyms.length}개 있어야 들어갈 수 있다`, p.x, p.y - 70, '#f88');
  if (b.kind === 'league' && p.rival && !p.rival.done.has('road')) return say('라이벌이 앞을 막고 있다!', p.x, p.y - 70, '#f88');
  world.returnTo = [b.doorX, b.doorY + p.r + 20];
  map = makeIndoor(b);
  map.tier = p.beaten.size;  // 체육관 세기는 체육관 번호가 아니라 들어갈 때 가진 배지 수로 정한다 (리그는 8)
  resetCombat();
  p.x = map.rooms[0].cx; p.y = (map.th - 1.6) * TS;
}

// 챔피언은 포켓몬을 낼 때마다 챔피언의 자격에 대해 말한다
const CHAMP_SAY = ['배지 8개, 그리고 사천왕까지. 여기까지 올라온 실력은 인정하지.', '하지만 챔피언은 강하기만 해서 앉는 자리가 아니야. 몇 번을 쓰러져도 포켓몬과 함께 다시 일어서는 것, 그게 자격이다.',
  '아직이야! 이 자리를 지켜 온 시간만큼, 내 포켓몬들도 물러서지 않아!', '좋아, 조금씩 보이는군. 너와 그 포켓몬이 어떤 길을 걸어왔는지.', '도망치지 않는구나. 챔피언의 자리는 너 같은 트레이너를 기다리고 있었어.'];
const CHAMP_ACE = '이게 마지막 한 마리다. 네가 챔피언이 될 자격이 있는지, 이 녀석으로 확인하겠어!';

// 방 안으로 걸어 들어서면 아래 문이 닫히고 승부가 시작된다. 이기면 아래·위 문이 열린다
function startRoom(r) {
  const p = player, b = map.building, gi = region.gyms.indexOf(map.leader), gt = map.tier ?? gi, champ = r.who === region.league.at(-1), at = { x: r.cx, y: (r.y0 + 1.6) * TS };
  r.started = true; map.room = r;
  setDoors(r.down, false);
  const open = () => { r.cleared = true; setDoors(r.down, true); setDoors(r.up, true); };
  if (r.npc) return startBattle({ who: r.npc.name, title: '체육관 트레이너', queue: Array.from({ length: rollRange(GYM_TRAINER_MONS[gt < EARLY_GYMS ? 'early' : 'late']) }, () => pick(map.leader.mobs)), x: r.npc.x, y: r.npc.y, rank: 'trainer', tier: gt, onWin: () => {
    open(); r.npc.defeated = true;
    gainMoney(200 + gt * 200, r.npc.x, r.npc.y);
    banner = { text: `${r.npc.name}에게 이겼다! 위쪽 문이 열렸다`, t: 2.5 };
    map.pickups.push({ kind: 'berry', x: r.cx, y: (r.y0 + r.y1) / 2 * TS });
  } });
  const hits0 = p.hits ?? 0;
  // 관장은 배지가 적을 때 엔트리 뒤쪽(에이스 포함) 몇 마리만 낸다: 배지 0~1개 2마리, 2~3개 3마리, 4개 이상 전부
  const leaderTeam = r.who.team.slice(-clamp(2 + Math.floor(gt / 2), 2, r.who.team.length));
  if (b.kind === 'gym') return startBattle({ who: r.who.leader, title: r.who.title, queue: leaderTeam, ...at, rank: 'boss', tier: gt, onWin: () => {
    open(); if ((p.hits ?? 0) === hits0) ach('perfect'); p.beaten.add(gi); map.portal = gymPortal(r);
    gainMoney(1500 + gt * 600, at.x, at.y + 2 * TS);
    banner = { text: `${r.who.leader}에게 이겼다! 배지를 손에 넣었다 (${p.beaten.size}/${region.gyms.length})`, t: 3 }; sfx('badge');
    map.pickups.push({ ...rollContent(Math.random, { tm: 0.55, ltm: 0.12, c: 0, r: 0.7, l: 0.3 }), x: r.cx, y: (r.y0 + 4.5) * TS });
  } });
  // 사천왕 → 이기면 위쪽 방 문이 열린다. 마지막 방은 챔피언
  startBattle({ who: r.who.leader, title: r.who.title, queue: [...r.who.team], ...at, rank: 'boss', tier: 8, wait: champ ? 4 : 1,
    say: champ && ((i, ace) => ace ? CHAMP_ACE : CHAMP_SAY[Math.min(i, CHAMP_SAY.length - 1)]), onWin: () => {
    open(); gainMoney(3000, at.x, at.y + 2 * TS);
    if (!champ) { heal(Math.ceil(p.maxHp / 2)); banner = { text: `${r.who.leader}에게 이겼다! 위쪽 방의 문이 열렸다`, t: 3 }; return; }
    recordClear(); store.del(SAVE_KEY);
    dialog = { name: r.who.leader, text: '...졌다. 너와 네 포켓몬이라면 이 자리를 맡겨도 되겠어. 오늘부터 네가 새로운 챔피언이다!', t: 6, keep: true };
    banner = { text: `챔피언 ${r.who.leader}에게 이겼다! 새로운 챔피언의 탄생이다!`, t: 5 }; p.winAt = 6;
  } });
  if (champ) dialog = { name: r.who.leader, text: `기다리고 있었어. 나는 ${region.name}지방의 챔피언 ${r.who.leader}. 이 방에 들어온 이상, 자격을 증명해야 해.`, t: 4, keep: true };
}

function leaveBuilding() {
  const p = player;
  map = world;
  [p.x, p.y] = world.returnTo;
  resetCombat();
  if (p.hp > 0 && p.winAt <= 0) autoSave();
}

function updateBattle(dt) {
  const bt = map.battle, p = player;
  if (!bt) return;
  // 트레이너에게서 멀리 도망치면 승부가 끝난다
  if (bt.npc && Math.hypot(p.x - bt.npc.x, p.y - bt.npc.y) > 750) {
    map.enemies = map.enemies.filter(e => !e.battle); bt.npc.fighting = false; map.battle = null;
    return banner = { text: '승부에서 도망쳤다', t: 2 };
  }
  if (map.enemies.some(e => e.battle)) return;
  if (bt.queue.length && (bt.wait -= dt) <= 0) {
    const m = MON[bt.queue.shift()], ang = Math.atan2(p.y - bt.y, p.x - bt.x), e = spawnEnemy(m, bt.x + Math.cos(ang) * 50, bt.y + Math.sin(ang) * 50, bt.rank, bt.tier);
    if (!bt.queue.length && bt.rank === 'boss') { e.hp *= 1.3; e.maxHp = e.hp; }  // 마지막 에이스는 더 단단하게
    e.battle = true;
    map.enemies.push(e); bt.wait = 1.2;
    const line = bt.say?.(bt.sent = (bt.sent ?? -1) + 1, !bt.queue.length);
    if (line) dialog = { name: bt.who, text: line, t: 4.5, keep: true };
    banner = { text: `${bt.who}은(는) ${m.name}을(를) 내보냈다!`, t: 2 };
  } else if (!bt.queue.length) { map.battle = null; bt.onWin(); }
}

// ---------- NPC ----------
function updateNpcs(dt) {
  const p = player;
  if (map.npcs.some(n => n.gone)) map.npcs = map.npcs.filter(n => !n.gone);
  for (const n of map.npcs) {
    if ((Math.abs(n.x - p.x) > 900 || Math.abs(n.y - p.y) > 700) && !n.rival) continue;
    if (n.kind !== 'trainer') { if (map === world) n.flip = p.x > n.x; continue; }
    if (n.rival && n.leaveT !== undefined && (n.leaveT -= dt) <= 0) { n.gone = true; fx.push({ kind: 'poof', x: n.x, y: n.y, t: 0.3, max: 0.3 }); continue; }
    if (n.defeated || n.fighting) { n.moving = false; continue; }
    // 라이벌은 플레이어를 향해 곧장 걸어와서 승부를 건다
    if (n.rival) {
      const d = Math.hypot(p.x - n.x, p.y - n.y);
      if (!map.battle && d < 200) { startRival(n); continue; }
      const [wx, wy] = pathDir(n), ox = n.x, oy = n.y;
      moveBody(n, wx * 150 * dt, wy * 150 * dt);
      n.moving = n.x !== ox || n.y !== oy; n.flip = p.x > n.x;
      continue;
    }
    // 트레이너와 눈이 마주치면 승부
    if (!map.battle && Math.hypot(p.x - n.x, p.y - n.y) < 170) { n.flip = p.x > n.x; startTrainer(n); continue; }
    if ((n.turn -= dt) <= 0) { const hd = Math.hypot(n.hx - n.x, n.hy - n.y); n.dir = hd > 120 ? [(n.hx - n.x) / hd, (n.hy - n.y) / hd] : Math.random() < 0.4 ? [0, 0] : randDir(); n.turn = 1 + Math.random() * 2; }
    const ox = n.x, oy = n.y;
    moveBody(n, n.dir[0] * 45 * dt, n.dir[1] * 45 * dt);
    n.moving = n.x !== ox || n.y !== oy;
    if (n.dir[0]) n.flip = n.dir[0] > 0;
  }
}

function talk() {
  const p = player, n = map.npcs.find(n => n.kind !== 'gymtrainer' && Math.hypot(n.x - p.x, n.y - p.y) < 90);
  if (!n || map.battle) return;
  p.talked = true;
  const line = s => dialog = { name: n.name, text: s, t: 3 };
  if (n.kind === 'nurse') {
    // 마을마다 간호순은 한 번만 회복해 준다. 모험 기록은 언제든 해 준다
    if (!n.healed) { n.healed = true; p.hp = p.maxHp; line('어서 오세요! 포켓몬의 체력을 모두 회복했어요! 모험도 기록해 둘게요.'); sfx('heal'); }
    else line('오늘 이 포켓몬센터의 회복은 이미 받으셨어요. 모험 기록만 해 둘게요!');
    autoSave();
  }
  if (n.kind === 'shop') { shopNpc = n; state = 'shop'; dialog = null; }
  if (n.kind === 'gift') {
    if (!n.gift) return line('여행 조심해!');
    map.pickups.push({ ...n.gift, x: n.x, y: n.y + 50, ball: true }); n.gift = null; line('이걸 줄게!');
  }
  if (n.kind === 'trainer') n.defeated ? line(n.rival ? '다음엔 내가 이긴다!' : '졌다...') : n.rival ? startRival(n) : startTrainer(n);
}

const shopPrice = s => Math.round(s.price * (s.grow ? 1.25 ** (player.bought[s.id] ?? 0) : 1));
const shopSpecial = n => !n.sold && n.special.kind !== 'berry' ? n.special : null;
const specialPrice = sp => sp.kind === 'tm' ? (sp.tm.legend ? 15000 : 5000) : sp.item.r === 'l' ? 12000 : 6000;

function buy(i) {
  const p = player, n = shopNpc, s = SHOP[i], sp = i === SHOP.length ? shopSpecial(n) : null;
  const price = s ? shopPrice(s) : sp ? specialPrice(sp) : null;
  if (price === null) return;
  if (p.money < price) { sfx('deny'); return say('돈이 모자라다', p.x, p.y - 70, '#f88'); }
  p.money -= price; sfx('item');
  if (s) { s.use(); p.bought[s.id] = (p.bought[s.id] ?? 0) + 1; say(`${s.name}을(를) 샀다`, p.x, p.y - 70, '#8f8'); }
  else { n.sold = true; map.pickups.push({ ...sp, x: p.x, y: p.y - 10 }); state = 'play'; }
}

// ---------- 메인 업데이트 ----------
function update(dt) {
  const p = player;
  refreshFx();
  now += dt; dayTime += map === world ? dt : 0; p.cd -= dt; p.inv -= dt; p.dashCd -= dt; p.eruptCd -= dt; textCd -= dt; shake -= dt; timeStop -= dt;
  if (banner && (banner.t -= dt) <= 0) banner = null;
  if (lastInfo) lastInfo.t -= dt;
  if (dialog && ((dialog.t -= dt) <= 0 || (map.battle && !dialog.keep))) dialog = null;
  p.deltas.forEach(d => d && (d.t -= dt));
  if (p.winAt > 0 && (p.winAt -= dt) <= 0) { state = 'win'; return; }
  p.time += dt; p.hop -= dt;
  if (p.regen && (p.regenT -= dt) <= 0) { p.regenT = 12; heal(1); }
  if ((p.achT = (p.achT ?? 0) - dt) <= 0) { p.achT = 0.5; checkAch(); }
  tickTutorial();

  let vx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), vy = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  const len = Math.hypot(vx, vy) || 1, ox = p.x, oy = p.y;
  vx /= len; vy /= len;
  // 스페이스: 짧게 뛰어 피하기. 뛰는 동안은 무적이라 돌진, 낙하, 충격파를 넘길 수 있다
  if ((keys.Space || p.dashQ) && p.dashCd <= 0) {
    p.dashQ = false;
    sfx('dash'); p.dashed = true;
    p.dash = 0.2; p.dashCd = hasFx('dashStrike') ? 0.45 : hasFx('vanish') ? 1 : 0.7; p.dashDir = vx || vy ? [vx, vy] : [p.flip ? 1 : -1, 0]; p.dashHit = new Set();
    if (hasFx('vanish')) p.vanish = 0.6;
  }
  if (p.dash > 0) {
    p.dash -= dt; vx = p.dashDir[0] * 3; vy = p.dashDir[1] * 3;
    if (hasFx('dashStrike')) for (const e of map.enemies) if (!p.dashHit.has(e) && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r + 8) {
      p.dashHit.add(e); damage(e, p.dmg * 4, moveDef([...p.moves].find(id => moveDef(id).fx === 'dashStrike')).type);
      fx.push({ kind: 'boom', x: e.x, y: e.y, r: 30, t: 0.2, max: 0.2, color: '#fff' });
    }
  }
  if (p.vanish > 0 && (p.vanish -= dt) <= 0) {
    fx.push({ kind: 'boom', x: p.x, y: p.y, r: 100, t: 0.3, max: 0.3, color: TYPE_COLOR.ghost }); shake = 0.2;
    for (const e of enemiesNear(p.x, p.y, 100)) damage(e, p.dmg * 3, 'ghost');
  }
  if (vx && !(keys.ArrowLeft || keys.ArrowRight)) p.flip = vx > 0;
  moveBody(p, vx * p.speed * dt, vy * p.speed * dt); clampBody(p);
  p.walk += Math.hypot(p.x - ox, p.y - oy); p.moving = p.x !== ox || p.y !== oy;
  if (vx || vy) p.face = faceRow(vx, vy);
  if (map === world && world.solid[Math.floor(p.y / TS) * world.tw + Math.floor(p.x / TS)] === 8 && vy > 0 && p.hop <= 0) p.hop = 0.35;

  if (map.kind === 'indoor') {
    if (p.y > (map.th - 1) * TS + 10) return leaveBuilding();
    if (map.portal && Math.hypot(p.x - map.portal.x, p.y - map.portal.y) < 28) return leaveBuilding();
    const r = roomAt(Math.floor(p.y / TS));
    if (r && !r.started && !map.battle && p.y < (r.y1 - 1.2) * TS) startRoom(r);
  } else {
    // 문 바로 아래에서 위로 밀면 입장. 빠를수록 한 프레임 이동이 커서 건물 앞 여유를 넉넉히 둔다
    for (const b of world.buildings) if (keys.KeyW && Math.abs(p.x - b.doorX) < 22 && p.y < b.doorY + p.r + 14 && p.y > b.doorY) return enterBuilding(b);
    const n = nodeAt(p.x, p.y);
    if (n !== curNode) {
      curNode = n;
      if (!n.visited) { n.visited = true; banner = { text: n.name, t: 2 }; }
    }
    manageSpawns(dt);
    checkLegends();
    rivalCheck();
  }

  attack(dt);
  updateNpcs(dt);

  // 시간의포효: 주기적으로 적과 적의 공격이 멈춘다
  if (hasFx('timeStop') && (p.stopCd -= dt) <= 0 && map.enemies.some(e => Math.hypot(e.x - p.x, e.y - p.y) < 500)) { p.stopCd = 7; timeStop = 1.8; banner = { text: '시간이 멈췄다!', t: 1.5 }; }
  const frozenTime = timeStop > 0;

  if ((flowT -= dt) <= 0) { flowT = 0.25; buildFlow(); }
  const enemies = map.enemies;
  if (!frozenTime) for (const e of enemies) if (Math.abs(e.x - p.x) < 1100 && Math.abs(e.y - p.y) < 900) updateEnemy(e, dt);
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.flying !== b.flying || a.act || b.act) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, o = a.r + b.r - d;
    if (o > 0) { moveBody(a, -dx / d * o / 2, -dy / d * o / 2); moveBody(b, dx / d * o / 2, dy / d * o / 2); }
  }

  if (!frozenTime) for (const h of hazards) {
    if (h.kind === 'strike' && (h.t -= dt) <= 0) {
      fx.push({ kind: 'boom', x: h.x, y: h.y, r: h.r, t: 0.25, max: 0.25, color: TYPE_COLOR[h.type] });
      if (Math.hypot(p.x - h.x, p.y - h.y) < h.r + p.r * 0.5) hurt(h.type, 1, h);
      h.done = true;
    }
    if (h.kind === 'quake') {
      h.R += 260 * dt;
      // 지진 충격파는 땅을 타고 오므로, 진원지와 나 사이에 바위·기둥이 있으면 막힌다
      if (!h.hit && Math.abs(Math.hypot(p.x - h.x, p.y - h.y) - h.R) < 14 + p.r * 0.5) {
        h.hit = true;
        if (losBlocked(h.x, h.y, p.x, p.y)) say('엄폐물 뒤에서 충격파를 피했다!', p.x, p.y - 60, '#aef'); else hurt(h.type, 1, h);
      }
      if (h.R > 560) h.done = true;
    }
  }
  hazards = hazards.filter(h => !h.done);
  for (const s of pstrikes) if ((s.t -= dt) <= 0) {
    s.done = true; fx.push({ kind: 'boom', x: s.x, y: s.y, r: s.r ?? 40, t: 0.25, max: 0.25, color: TYPE_COLOR[s.type ?? 'rock'] });
    for (const e of enemiesNear(s.x, s.y, s.r ?? 40)) damage(e, p.dmg * (s.mul ?? 0.8), s.type ?? 'rock', false, true);
  }
  pstrikes = pstrikes.filter(s => !s.done);
  for (const u of puddles) {
    u.t -= dt;
    if ((u.tick -= dt) <= 0) { u.tick = 0.4; for (const e of enemiesNear(u.x, u.y, u.r)) if (!e.flying) damage(e, p.dmg * 0.25, 'poison', true, true); }
  }
  puddles = puddles.filter(u => u.t > 0);

  const bc = beamCfg();
  for (const b of beams) {
    b.t -= dt;
    if ((b.tick -= dt) > 0) continue;
    b.tick = 0.05;
    const pts = beamPath(b);
    for (const e of enemies) {
      if (!pts.some(([x, y]) => Math.hypot(e.x - x, e.y - y) < b.w / 2 + e.r)) continue;
